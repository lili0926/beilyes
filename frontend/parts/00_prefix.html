    /* 柜子 */
    .cab-list { display: flex; flex-direction: column; gap: 10px; }
    .cab-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      cursor: pointer; text-align: left; width: 100%;
    }
    .cab-row:active { transform: scale(0.98); }
    .cab-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
    }
    .cab-meta { flex: 1; min-width: 0; }
    .cab-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .cab-count { font-size: 11px; color: var(--sub); margin-top: 2px; }
    .cab-modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 125;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .cab-modal {
      width: 100%; max-width: 420px; background: var(--card); border-radius: 18px 18px 0 0;
      border: 1px solid var(--border); border-bottom: none;
      max-height: 78vh; display: flex; flex-direction: column;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
    }
    .cab-modal-head {
      display: flex; align-items: center; gap: 10px; padding: 14px 16px 8px;
      border-bottom: 1px solid var(--border);
    }
    .cab-modal-body { flex: 1; overflow-y: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; }
    .cab-modal-foot {
      flex-shrink: 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap;
    }
    .cab-swipe-hint { text-align: center; font-size: 10px; color: var(--sub); opacity: 0.6; margin-bottom: 8px; }
    .cab-item {
      background: color-mix(in srgb, var(--card) 90%, var(--accent2));
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    }
    .cab-item .ci-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .cab-item .ci-note { font-size: 11px; color: var(--sub); margin-top: 4px; line-height: 1.45; }
    .cab-item .ci-by { font-size: 10px; color: var(--sub); opacity: 0.75; margin-top: 4px; }


    /* 电话 / 来电 */
    .call-status-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 14px; margin: 0 0 10px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 12px; color: var(--text);
    }
    .call-status-bar .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0;
    }
    .call-status-bar.on .dot { background: #6bcf8e; box-shadow: 0 0 0 3px rgba(107,207,142,0.25); }
    .call-status-bar.live .dot { background: var(--accent); animation: callRip 1.2s infinite; }
    .call-status-bar.off .dot { background: #c45; }
    .call-bub .src-tag {
      display: inline-block; font-size: 10px; color: var(--sub); margin-bottom: 3px;
      padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 80%, var(--card));
    }

    .call-page { padding: 0 0 80px; min-height: calc(100vh - 60px); }
    .call-hero {
      text-align: center; padding: 28px 20px 18px;
      background: color-mix(in srgb, var(--accent) 12%, var(--card));
      border-bottom: 1px solid var(--border);
    }
    .call-av-wrap { position: relative; width: 96px; height: 96px; margin: 0 auto 12px; }
    .call-av {
      width: 96px; height: 96px; border-radius: 50%; overflow: hidden;
      background: var(--accent2); border: 3px solid var(--accent);
      display: flex; align-items: center; justify-content: center; font-size: 36px;
    }
    .call-av img { width: 100%; height: 100%; object-fit: cover; }
    .call-ripple {
      position: absolute; inset: -8px; border-radius: 50%;
      border: 1.5px solid color-mix(in srgb, var(--accent) 55%, transparent);
      animation: callRip 2.2s ease-out infinite; pointer-events: none;
    }
    .call-ripple.r2 { animation-delay: .7s; }
    @keyframes callRip { from { transform: scale(1); opacity: .85; } to { transform: scale(1.55); opacity: 0; } }
    .call-name { font-size: 18px; font-weight: 700; color: var(--text); }
    .call-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .call-timer { font-size: 28px; font-weight: 700; color: var(--text); margin: 8px 0; font-variant-numeric: tabular-nums; }
    .call-caps {
      max-height: 220px; overflow-y: auto; padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .call-bub {
      max-width: 82%; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.5;
    }
    .call-bub.them {
      align-self: flex-start; background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-bottom-left-radius: 4px;
    }
    .call-bub.me {
      align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px;
    }
    .call-dock {
      display: flex; justify-content: center; gap: 28px; padding: 18px 16px 8px;
    }
    .call-act { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border: none; background: none; }
    .call-ico {
      width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 22px; border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    .call-ico.accept { background: linear-gradient(160deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #c45)); color: #fff; border: none; }
    .call-ico.hang { background: #c45; color: #fff; border: none; }
    .call-lab { font-size: 11px; color: var(--sub); }
    .call-hold {
      width: 100%; padding: 16px; border-radius: 16px; border: 1px dashed var(--border);
      background: color-mix(in srgb, var(--accent) 10%, var(--card)); color: var(--text);
      font-size: 14px; font-weight: 600; text-align: center; user-select: none;
      touch-action: none; margin-top: 8px;
    }
    .call-hold.rec {
      background: color-mix(in srgb, #c45 25%, var(--card));
      border-color: #c45; color: #c45;
    }
    .call-hold:disabled { opacity: 0.5; }
    .call-incoming-mask {
      position: fixed; inset: 0; z-index: 200; background: rgba(40,30,28,.35);
      backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .call-incoming-card {
      width: min(92vw, 320px); background: color-mix(in srgb, var(--card) 88%, transparent);
      border: 1px solid color-mix(in srgb, #fff 55%, var(--border));
      border-radius: 28px; padding: 28px 22px 22px; text-align: center;
      box-shadow: 0 22px 70px rgba(90,60,55,.22);
      backdrop-filter: blur(28px);
    }
    .call-record {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 12px; margin-bottom: 8px; font-size: 12px; color: var(--text);
    }

    /* ── 碎星 Spark Vault · 灵感收集 ── */
    .spark-page { background: linear-gradient(180deg, color-mix(in srgb, var(--accent2) 60%, transparent) 0%, var(--bg) 150px); padding-bottom: 130px; }
    .spark-books { display: flex; gap: 10px; overflow-x: auto; padding: 12px 14px 8px; scrollbar-width: none; }
    .spark-books::-webkit-scrollbar { display: none; }
    .spark-book {
      position: relative; flex: 0 0 auto; width: 82px; height: 118px; border-radius: 14px 14px 6px 6px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 10px 6px 12px; gap: 3px; box-shadow: 0 4px 14px rgba(0,0,0,.06);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .spark-book.on {
      transform: translateY(-4px); border-color: var(--accent);
      background: linear-gradient(180deg, var(--card) 0%, color-mix(in srgb, var(--accent) 16%, var(--card)) 100%);
      box-shadow: 0 8px 22px rgba(0,0,0,.12);
    }
    .spark-book .sb-ico { position: absolute; top: 8px; font-size: 20px; opacity: .85; }
    .spark-book .sb-title { font-size: 11px; line-height: 1.3; max-height: 30px; overflow: hidden; }
    .spark-book .sb-count { font-size: 9px; color: var(--sub); }
    .spark-book.add { border-style: dashed; width: 62px; justify-content: center; font-size: 11px; color: var(--sub); }
    .spark-tags { display: flex; gap: 8px; overflow-x: auto; padding: 6px 14px 4px; scrollbar-width: none; }
    .spark-tags::-webkit-scrollbar { display: none; }
    .spark-tag { flex: 0 0 auto; font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); color: var(--sub); background: var(--card); }
    .spark-tag.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .spark-board { columns: 2; column-gap: 10px; padding: 8px 14px 12px; }
    .spark-card {
      break-inside: avoid; width: 100%; margin-bottom: 10px; padding: 12px; border-radius: 16px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); text-align: left; display: block; box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }
    .spark-card:nth-child(odd) { transform: rotate(-1.2deg); }
    .spark-card:nth-child(even) { transform: rotate(1.1deg); }
    .spark-card:active { transform: scale(.97); }
    .spark-card .sc-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .spark-card .sc-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .spark-card .sc-tags span { font-size: 10px; padding: 2px 8px; border-radius: 20px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    .spark-card .sc-dot { font-size: 10px; color: var(--sub); margin-top: 6px; }
    .spark-card .sc-note { font-size: 11px; color: var(--sub); margin-top: 6px; line-height: 1.4; }
    .spark-empty { column-span: all; text-align: center; color: var(--sub); font-size: 13px; padding: 40px 0; }
    .spark-progress { text-align: center; font-size: 10px; color: var(--sub); padding: 2px 14px 8px; }
    .spark-progress.ok { color: color-mix(in srgb, var(--accent) 80%, var(--sub)); }
    .spark-input {
      position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 58px);
      display: flex; gap: 8px; z-index: 30; padding: 8px;
      background: var(--card); border: 1px solid var(--border); border-radius: 24px;
      box-shadow: 0 6px 20px rgba(0,0,0,.10);
    }
    .spark-input input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 14px; padding: 8px 4px; }
    .spark-input input::placeholder { color: var(--sub); }
    .spark-input .btn-accent { flex: 0 0 auto; border: none; border-radius: 18px; padding: 8px 16px; font-size: 13px; }
    .spark-mask { position: fixed; inset: 0; background: rgba(30,20,40,.35); backdrop-filter: blur(4px); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
    .spark-detail { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 16px; max-height: 80vh; overflow-y: auto; color: var(--text); }
    .spark-detail label { display: block; font-size: 11px; color: var(--sub); margin: 12px 0 5px; }
    .spark-detail .sd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
    .spark-detail .sd-title { font-size: 15px; font-weight: 800; }
    .spark-detail .sd-x { border: none; background: var(--bg); color: var(--sub); width: 26px; height: 26px; border-radius: 50%; font-size: 13px; border: 1px solid var(--border); }
    .spark-detail .sd-text { font-size: 14px; line-height: 1.6; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px; white-space: pre-wrap; word-break: break-word; }
    /* 收藏聊天记录（微信聊天记录搜索 UI） */
    .saved-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .saved-modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; width: 100%; max-width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,0.25); max-height: 78vh; display: flex; flex-direction: column; overflow: hidden; }
    .saved-preview { padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 100%; word-break: break-word; white-space: pre-wrap; max-height: 28vh; overflow-y: auto; -webkit-overflow-scrolling: touch; flex-shrink: 1; }
    .saved-preview.me { background: var(--bubble-me); color: var(--bubble-me-fg); margin-left: 28px; }
    .saved-preview.them { background: var(--bubble-them); color: var(--bubble-them-fg); border: 1px solid var(--border); margin-right: 28px; }
    .saved-search-wrap { padding: 10px 0 4px; }
    .saved-search-box { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
    .saved-search-box input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 14px; min-width: 0; }
    .saved-search-clear { border: none; background: transparent; color: var(--sub); font-size: 14px; cursor: pointer; padding: 2px 4px; }
    .saved-cats { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 12px; -webkit-overflow-scrolling: touch; }
    .saved-cat-add { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; }
    .saved-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; }
    .saved-item { display: flex; gap: 8px; align-items: flex-start; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
    .saved-item-main { flex: 1; min-width: 0; }
    .saved-item-name { font-size: 12px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .saved-item-cat { font-size: 10px; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 1px 6px; border-radius: 8px; font-weight: 600; }
    .saved-item-bubble {
      padding: 7px 11px; border-radius: 12px; font-size: 13px; line-height: 1.55;
      word-break: break-word; white-space: pre-wrap;
      max-height: 160px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    .saved-item-bubble.me { background: var(--bubble-me); color: var(--bubble-me-fg); }
    .saved-item-bubble.them { background: var(--bubble-them); color: var(--bubble-them-fg); border: 1px solid var(--border); }
    .saved-item-meta { font-size: 10px; color: var(--sub); margin-top: 4px; }
    .saved-del { border: none; background: transparent; color: var(--sub); cursor: pointer; padding: 6px; flex-shrink: 0; opacity: 0.7; }
    .saved-del:hover { opacity: 1; color: #e06c6c; }
    mark.saved-hl { background: #ffe08a; color: #3a2a00; border-radius: 3px; padding: 0 1px; }
    .spark-detail .sd-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .spark-detail .sd-tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 8px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent); }
    .spark-detail .sd-tag button { border: none; background: transparent; color: inherit; font-size: 12px; cursor: pointer; }
    .spark-detail input, .spark-detail textarea {
      width: 100%; box-sizing: border-box; background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 10px; color: var(--text); font-size: 13px; outline: none;
    }
    .spark-detail textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
    .spark-detail .sd-actions { display: flex; gap: 8px; margin-top: 16px; }
    .spark-detail .sd-actions button { flex: 1; }

    /* 主题 */
    .theme-group { margin-bottom: 20px; }
    .theme-group-label { font-size: 11px; color: var(--sub); margin-bottom: 10px; }
    .chip-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .theme-chip {
      border: 2px solid var(--border); background: var(--card); border-radius: 50%;
      width: 38px; height: 38px; padding: 5px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .theme-chip.active {
      border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent);
      transform: scale(1.06);
    }
    .theme-dot { width: 100%; height: 100%; border-radius: 50%; }
    .preview-box { border-radius: 16px; padding: 20px; border: 1px solid var(--border); }
    .preview-inner { border-radius: 12px; padding: 16px; border: 1px solid var(--border); }

    /* 提示词 */
    .prompt-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; transition: all 0.2s;
    }
    .prompt-card.off { opacity: 0.5; }
    .prompt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .prompt-title-row { display: flex; align-items: center; gap: 8px; }
    .prompt-title { font-size: 13px; font-weight: 700; color: var(--text); }
    .cat-tag { font-size: 10px; border-radius: 6px; padding: 1px 6px; }
    .prompt-body {
      font-size: 12px; color: var(--sub); line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .small-toggle {
      width: 32px; height: 18px; border-radius: 9px; cursor: pointer; position: relative; transition: background 0.2s;
    }
    .small-toggle .knob {
      position: absolute; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 0.2s;
    }

    /* 设置 */
    .section { margin-bottom: 24px; }
    .section-title { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 12px; letter-spacing: 0.5px; }
    .section-body {
      background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden;
    }
    .setting-row {
      display: flex; flex-direction: column; gap: 8px; padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .setting-row:last-child { border-bottom: none; }
    .setting-label { font-size: 12px; color: var(--sub); }
    .setting-row input {
      border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px;
      font-size: 13px; outline: none; background: var(--bg); color: var(--text); width: 100%;
    }
    .channel-btns { display: flex; gap: 8px; }
    .channel-btn {
      border: 1px solid var(--border); background: var(--card); color: var(--sub);
      border-radius: 16px; padding: 4px 14px; font-size: 11px; cursor: pointer;
    }
    .channel-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .settings-footer { font-size: 11px; color: var(--sub); text-align: center; margin-top: 20px; opacity: 0.5; }

    /* 他的机 */
    .hp-phone {
      max-width: 340px; margin: 0 auto; border-radius: 28px;
      border: 3px solid color-mix(in srgb, var(--text) 25%, var(--border));
      background: #1a1a1e; color: #f2f2f4; overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    .hp-status {
      display:flex; justify-content:space-between; padding:8px 16px 4px;
      font-size:10px; opacity:0.75;
    }
    .hp-screen { background: linear-gradient(180deg, #2a2430 0%, #1c1820 100%); min-height: 420px; padding: 12px 14px 18px; }
    .hp-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; margin-top: 12px; }
    .hp-app {
      border:none; background:transparent; color:#f2f2f4; cursor:pointer;
      display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px;
    }
    .hp-app .ico {
      width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
      font-size:24px; background: color-mix(in srgb, var(--accent) 55%, #444);
    }
    .hp-app.private .ico { background: #3a3038; }
    .hp-list-item {
      background: rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
      font-size: 12px; line-height: 1.5; text-align: left; width: 100%; border: 1px solid rgba(255,255,255,0.08);
      color: #eee;
    }
    .hp-list-item .meta { font-size: 10px; opacity: 0.55; margin-top: 4px; }
    .hp-nav {
      display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 10px;
    }
    .hp-nav button {
      border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06);
      color:#ddd; border-radius:999px; padding:4px 10px; font-size:11px; cursor:pointer;
    }
    .hp-nav button.on { background: var(--accent); border-color: transparent; color:#fff; }
    .brand-preview {
      border-radius: 16px; border:1px solid var(--border); padding: 20px; text-align:center;
      background: linear-gradient(180deg,#fdf6f2,#f5e4db); min-height: 140px;
      position: relative; overflow: hidden;
    }
    .brand-preview img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.85; }
    .brand-preview .txt { position:relative; z-index:1; }

    /* ─── 对话页 UI 改造 · 信件/参考图风格（仅结构布局，配色沿用主题变量） ─── */
    .chat-header { gap: 6px; padding: 8px 6px 6px 12px; }
    .chat-header .title { display: none; }
    .back-btn {
      background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer;
      padding: 2px 6px; line-height: 1; flex-shrink: 0; opacity: 0.75;
    }
    .chat-title-wrap {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      max-width: 62%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .chat-name {
      font-family: 'Caveat', 'Georgia', 'KaiTi', 'STKaiti', '楷体', cursive;
      font-style: italic; font-weight: 700; font-size: 22px; line-height: 1.25;
      color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
    }
    .chat-status { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--sub); margin-top: 1px; }
    .status-heart { color: #E88B9C; font-size: 9px; animation: baileysHeart 1.8s ease-in-out infinite; }
    @keyframes baileysHeart { 0%,100%{transform:scale(1)} 15%{transform:scale(1.3)} 30%{transform:scale(1)} }
    .chat-header-icons { display: flex; align-items: center; gap: 4px; flex-shrink: 0; position: relative; z-index: 3; }
    .chat-header-icons button { background: none; border: none; font-size: 15px; color: var(--sub); cursor: pointer; padding: 4px; line-height: 1; }
    .chat-header .chat-mode-switch { margin-right: 0; }
    .chat-header .chat-mode-switch button { font-size: 10px; padding: 3px 8px; }
    .chat-header .nsfw-toggle { gap: 3px; }
    .chat-header .nsfw-toggle > span { font-size: 13px; }

    /* TA / 我的消息：头像 + 名字 + 爱心 + 时间 的 meta 条 */
    .msg-meta {
      display: flex; align-items: center; gap: 5px;
      margin: 10px 0 3px 2px; font-size: 10px; color: var(--sub);
    }
    .msg-meta.me { justify-content: flex-end; margin: 10px 2px 3px 0; }
    .msg-meta-avatar { width: 20px; height: 20px; border-radius: 50%; overflow: hidden; flex-shrink: 0; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .msg-meta-avatar .bubble-avatar,
    .msg-meta-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 50%; }
    .msg-meta-avatar .bubble-avatar { font-size: 9px; }
    .msg-meta-name { font-weight: 600; font-size: 11px; color: var(--text); }
    .msg-meta-heart { color: #E88B9C; opacity: .75; font-size: 9px; }
    .msg-meta-time { opacity: .45; font-size: 9px; margin-left: 2px; }
    .msg-meta-time::before { content: "·"; margin-right: 3px; opacity: .6; }

    /* 输入栏 · 信件风格 */
    .letter-input-row { gap: 4px; padding: 2px 0 8px; }
    .letter-input-row .input-icon-btn {
      background: none; border: none; font-size: 18px; color: var(--sub);
      cursor: pointer; padding: 8px 5px; line-height: 1; flex-shrink: 0;
      transition: transform .1s, opacity .1s;
    }
    .letter-input-row .input-icon-btn:active { transform: scale(.9); opacity: .5; }
    /* 待回复触发按钮：绝对定位在发送键左侧，出现/消失都不挤动布局（发送键不动） */
    .letter-input-row { position: relative; }
    .letter-input-row .reply-trigger {
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
      padding: 8px 9px; display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      position: absolute; right: 44px; bottom: 4px; z-index: 3;
      box-shadow: 0 2px 8px rgba(0,0,0,.14);
    }
    .letter-input-row .reply-trigger b { font-size: 11px; opacity: .9; }
    .letter-input-row .reply-trigger:active { transform: scale(.9); opacity: .85; }
    .letter-input-row textarea { border-radius: 22px; padding: 9px 16px; min-height: 36px; }
    .letter-input-row textarea:focus { border-color: var(--accent); }
    .letter-input-row .send-btn { width: 38px; height: 38px; font-size: 16px; }

    /* 输入栏「+」圆形按钮：浅灰圆底，展开时旋转 45° */
    .chat-more-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: var(--border); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 0; margin: 0 0 4px; border: none; cursor: pointer;
      font-size: 17px; flex-shrink: 0; line-height: 1;
      transition: transform .15s ease, background .15s ease;
    }
    .chat-more-btn:active { transform: scale(.92); }
    .chat-more-btn.open { transform: rotate(45deg); background: var(--accent2); color: var(--text); }
    /* 弹出面板：轻量、圆角、米白统一 */
    .chat-more-panel {
      display: flex; gap: 4px; padding: 8px 6px;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,.06);
      animation: morePanelIn .16s ease;
    }
    @keyframes morePanelIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .chat-more-panel .chat-more-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer; padding: 6px 8px;
      border-radius: 10px; font-size: 11px; color: var(--text); line-height: 1;
    }
    .chat-more-panel .chat-more-item i { font-size: 20px; color: var(--sub); }
    .chat-more-panel .chat-more-item:active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .chat-more-panel .chat-more-item.rec { color: var(--accent); }
    .chat-more-panel .chat-more-item.rec i { color: var(--accent); }
    /* Lucide 图标统一尺寸跟随字号 */
    svg.lucide { width: 1em; height: 1em; vertical-align: -0.15em; stroke-width: 2; }
    /* ─── 小狗动作：爪印气泡 [action:xxx] ─────────────── */
    .paw-chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
      color: var(--accent); border-radius: 999px; padding: 2px 10px;
      font-size: 12px; cursor: pointer; vertical-align: -1px; margin: 0 2px;
    }
    .paw-chip svg { width: 13px; height: 13px; }
    .paw-chip:active { transform: scale(.95); }
    .paw-bubble {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--card); border: 1px dashed var(--accent);
      color: var(--text); border-radius: 999px; padding: 9px 16px;
      font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .paw-bubble svg { width: 17px; height: 17px; color: var(--accent); }
    .paw-bubble:active { transform: scale(.96); }
    .bubble-row.me .paw-chip, .bubble-row.me .paw-bubble { cursor: default; opacity: .8; }
    /* 小狗按钮：全屏按钮页 */
    .puppy-tab {
      border: 1px solid var(--border); background: var(--bg); color: var(--sub);
      border-radius: 20px; padding: 4px 12px; font-size: 11px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .puppy-tab.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
    .puppy-chip {
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 18px; padding: 7px 12px; font-size: 12px; cursor: pointer;
    }
    .puppy-chip svg { color: var(--accent); width: 14px; height: 14px; }
    .puppy-chip:active { transform: scale(.96); }
    .puppy-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .puppy-overlay-card {
      width: 100%; max-width: 440px; max-height: 82vh; overflow-y: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 18px;
      padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.3);
    }
    .puppy-overlay-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .puppy-overlay-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .puppy-overlay-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .puppy-overlay-grid .puppy-chip {
      justify-content: flex-start; white-space: normal; width: 100%; text-align: left;
      display: flex; align-items: center; gap: 7px; padding: 11px 12px; border-radius: 12px;
      font-size: 12px; line-height: 1.35;
    }
    /* ─── 表情包 [sticker:xxx] ─────────────────────────── */
    .sticker-floats { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px; }
    .sticker-img {
      width: 150px; height: 150px; object-fit: contain; border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 6%, var(--card));
      border: 1px solid var(--border);
    }
    .sticker-inline { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .sticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .sticker-card {
      position: relative; border: 1px solid var(--border); background: var(--bg);
      border-radius: 12px; padding: 8px; cursor: pointer; text-align: center;
    }
    .sticker-card img { width: 100%; height: 96px; object-fit: contain; border-radius: 8px; background: var(--card); }
    .sticker-card:active { transform: scale(.96); }
    .sticker-name { display: block; font-size: 11px; color: var(--sub); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sticker-noimg { height: 96px; display: flex; align-items: center; justify-content: center; color: var(--sub); border-radius: 8px; background: var(--card); }
    .sticker-noimg svg { width: 28px; height: 28px; }
    .sticker-del {
      position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; line-height: 1;
      border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 13px;
      cursor: pointer; opacity: 0; transition: opacity .15s;
    }
    .sticker-card:hover .sticker-del { opacity: 1; }
    .sticker-add-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .sticker-add-form input {
      width: 100%; box-sizing: border-box; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: 13px;
    }
    /* ─── 书房：书架 ─────────────────────────────────────── */
    .shufang-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 12px; padding: 8px 4px 20px; }
    .shufang-card { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .shufang-card .mem-del { position: absolute; top: -4px; right: -4px; z-index: 2; }
    .shufang-cover {
      width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
      display: flex; align-items: flex-end; padding: 10px 8px; position: relative; overflow: hidden;
    }
    .shufang-cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.5), transparent 55%); pointer-events: none; }
    .shufang-cover-title { position: relative; z-index: 1; font-size: 12px; font-weight: 600; line-height: 1.35; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.3); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .shufang-card.add .shufang-cover { background: var(--card) !important; border: 1.5px dashed var(--border); box-shadow: none; align-items: center; justify-content: center; }
    .shufang-card.add .shufang-cover::after { display: none; }
    .shufang-plus { font-size: 28px; font-weight: 300; color: var(--sub); }
    .shufang-card-name { margin-top: 7px; font-size: 12px; color: var(--text); text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .shufang-card-meta { font-size: 10px; color: var(--sub); margin-top: 2px; }
    /* ─── 桌宠：浮窗像素宠物 ─────────────────────────── */
    .pet-float {
      position: fixed; right: 14px; bottom: 96px; z-index: 40;
      width: 74px; height: 74px; pointer-events: auto; cursor: grab;
      touch-action: none; user-select: none; -webkit-user-select: none;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.18));
    }
    .pet-float.dragging { cursor: grabbing; }
    .pet-float svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .pet-bob { animation: pet-bob 3.2s ease-in-out infinite; }
    @keyframes pet-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .pet-bubble {
      position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
      background: var(--card); border: 1px solid var(--border); color: var(--sub);
      font-size: 10px; padding: 2px 8px; border-radius: 10px; white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,.1);
    }

    /* 顶栏计分 chip */
    .love-score-chip { display: inline-flex; align-items: center; gap: 3px; color: var(--accent); }
    .love-score-chip b { font-size: 15px; }
    /* 情侣计分器页面 */
    .love-meter { text-align: center; padding: 26px 16px 18px; }
    .love-big { font-size: 64px; font-weight: 800; color: var(--text); line-height: 1; }
    .love-big .love-total { font-size: 18px; font-weight: 500; color: var(--sub); }
    .love-bar { height: 12px; border-radius: 6px; background: var(--border); overflow: hidden; margin: 16px 8px 0; }
    .love-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #f5a0a0, #e070a0, #c060a0); transition: width .4s; }
    .love-quick { display: flex; gap: 10px; }
    .love-quick .btn-ghost { flex: 1; padding: 10px; font-size: 15px; font-weight: 600; }
    .love-history { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--card); }
    .love-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
    .love-row:last-child { border-bottom: none; }
    .love-delta { font-weight: 700; min-width: 26px; }
    .love-reason { flex: 1; color: var(--text); }
    .love-time { color: var(--sub); font-size: 10px; }
    /* 主页资料卡 */
    .profile-cover {
      position: relative; width: 100%; min-height: 190px; border-radius: 18px; overflow: hidden;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 22px 18px 20px; box-sizing: border-box; color: #fff; text-align: center; margin-top: 12px;
    }
    .profile-cover.has-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(0,0,0,.55)); }
    .profile-cover > * { position: relative; z-index: 2; }
    .profile-avatar-big {
      width: 76px; height: 76px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,.85);
      background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center;
      font-size: 34px; margin-bottom: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }
    .profile-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name-big { font-size: 20px; font-weight: 800; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
    .profile-signature { font-size: 12px; opacity: .92; margin-top: 6px; text-shadow: 0 1px 4px rgba(0,0,0,.4); }
    .profile-field { padding: 12px 2px; border-bottom: 1px solid var(--border); }
    .profile-field:last-child { border-bottom: none; }
    .profile-field-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
    .profile-field-val { font-size: 14px; color: var(--text); line-height: 1.5; word-break: break-word; }
    /* ─── 券夹：纸张券面 ─────────────────────────────── */
    .coupon-card {
      position: relative; width: 100%; max-width: 300px; min-height: 172px;
      padding: 20px 22px 16px; box-sizing: border-box; border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
      background: var(--cp, #E8DCC9); color: rgba(0,0,0,.82);
      overflow: hidden; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .coupon-card:active { transform: scale(.985); }
    .coupon-card.coupon-used { cursor: default; }
    .coupon-inner-border { position: absolute; inset: 8px; border: 1px dashed rgba(0,0,0,.25); border-radius: 10px; pointer-events: none; z-index: 1; }
    .coupon-card > *:not(.coupon-inner-border) { position: relative; z-index: 2; }
    /* 纸张纹理（覆盖底色、内容之下） */
    .coupon-card::before { content:""; position:absolute; inset:0; border-radius:14px; pointer-events:none; z-index:1; }
    .coupon-tex-grid::before {
      background-image: linear-gradient(rgba(0,0,0,.055) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0,0,0,.055) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .coupon-tex-dots::before { background-image: radial-gradient(rgba(0,0,0,.08) 1.1px, transparent 1.1px); background-size: 12px 12px; }
    .coupon-tex-lines::before { background-image: repeating-linear-gradient(transparent 0 21px, rgba(0,0,0,.055) 21px 21.6px); }
    .coupon-tex-fiber::before {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
    }
    .coupon-tex-plain::before { background: none; }
    .coupon-code { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 2px; color: rgba(0,0,0,.45); text-transform: uppercase; }
    .coupon-title { font-size: 26px; line-height: 1.25; margin-top: 26px; letter-spacing: 1px; }
    .coupon-title.cp-font-round { font-family: 'PingFang SC','Microsoft YaHei',sans-serif; font-weight: 600; }
    .coupon-title.cp-font-hand { font-family: 'Ma Shan Zheng','KaiTi','STKaiti',serif; font-weight: 400; font-size: 30px; }
    .coupon-title.cp-font-serif { font-family: 'Songti SC','SimSun','STSong',serif; font-weight: 600; }
    .coupon-subtitle { font-size: 13px; color: rgba(0,0,0,.55); margin-top: 10px; line-height: 1.5; }
    .coupon-redeem-hint { position: absolute; left: 22px; bottom: 14px; font-size: 10px; color: rgba(0,0,0,.42); letter-spacing: .5px; }
    .coupon-stamp {
      position: absolute; right: 14px; top: 46%; transform: translateY(-50%) rotate(-12deg);
      font-family: 'Songti SC','SimSun',serif; font-size: 16px; font-weight: 700; color: #c0392b;
      border: 2px solid rgba(192,57,43,.75); border-radius: 6px; padding: 2px 10px; opacity: .85; z-index: 3;
    }
    /* 券夹页面 */
    .coupon-section-label { font-size: 12px; color: var(--sub); margin: 20px 0 10px; letter-spacing: .5px; display: flex; align-items: center; gap: 6px; }
    .coupon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .coupon-mini {
      position: relative; border-radius: 12px; min-height: 112px; padding: 13px 14px; box-sizing: border-box;
      box-shadow: 0 4px 12px rgba(0,0,0,.10); background: var(--cp, #E8DCC9); overflow: hidden;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .coupon-mini:active { transform: scale(.98); }
    .coupon-mini.coupon-used { cursor: default; opacity: .82; }
    .coupon-mini::before { content:""; position:absolute; inset:0; border-radius:12px; pointer-events:none; }
    .coupon-mini > *:not(.coupon-inner-border) { position: relative; z-index: 2; }
    .coupon-mini .coupon-mini-title { font-size: 18px; line-height: 1.3; letter-spacing: .5px; }
    .coupon-mini .coupon-mini-title.cp-font-hand { font-size: 22px; }
    .coupon-mini .coupon-mini-sub { font-size: 11px; color: rgba(0,0,0,.55); margin-top: 7px; line-height: 1.4; }
    .coupon-sent-tag {
      position: absolute; right: 10px; bottom: 8px; font-size: 9px; color: rgba(0,0,0,.4);
      letter-spacing: 1px;
    }
    .coupon-mini .coupon-stamp { right: 10px; top: 44%; font-size: 13px; padding: 1px 7px; }
    .coupon-mini .coupon-inner-border { inset: 5px; border-radius: 8px; }
    .coupon-edit-btn {
      position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; border: none; cursor: pointer;
      background: rgba(0,0,0,.35); color: #fff; opacity: .78; z-index: 4; font-size: 11px;
    }
    .coupon-edit-btn:active { transform: scale(.9); }
    /* 小纸条 / 机日记 / 信箱：聊天卡片 */
    .mc-card { position: relative; max-width: 250px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .mc-card:active { transform: scale(.985); }
    /* 小纸条：撕纸边 */
    .mc-note {
      background: var(--card); padding: 14px 16px 12px; border-radius: 4px;
      box-shadow: 0 3px 10px rgba(0,0,0,.1);
    }
    .mc-note::before {
      content:''; position:absolute; top:-6px; left:0; right:0; height:12px;
      background: var(--card);
      clip-path: polygon(0% 60%,3% 20%,6% 70%,9% 10%,12% 65%,15% 25%,18% 75%,21% 15%,24% 60%,27% 30%,30% 80%,33% 20%,36% 55%,39% 10%,42% 70%,45% 25%,48% 65%,51% 15%,54% 75%,57% 30%,60% 60%,63% 20%,66% 70%,69% 10%,72% 65%,75% 25%,78% 75%,81% 15%,84% 60%,87% 30%,90% 80%,93% 20%,96% 55%,100% 40%,100% 100%,0% 100%);
    }
    .mc-note-body { font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .mc-note-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 10px; color: var(--sub); }
    .mc-tag { background: var(--border); color: var(--sub); border-radius: 8px; padding: 1px 6px; font-size: 9px; }
    /* 机日记轻提示 */
    .mc-diary-notice {
      max-width: 260px; background: color-mix(in srgb, var(--accent) 10%, var(--card));
      border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      border-radius: 14px; padding: 10px 14px; font-size: 12px; color: var(--text); line-height: 1.5;
    }
    .mc-diary-notice .mc-dn-title { font-weight: 600; }
    .mc-diary-notice .mc-dn-sub { margin-top: 3px; font-size: 11px; color: var(--sub); }
    /* 信箱：信封卡 */
    .mc-letter {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }
    .mc-letter-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .mc-letter-icon {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      background: color-mix(in srgb, var(--accent2) 55%, transparent);
      display: flex; align-items: center; justify-content: center; color: var(--text); font-size: 15px;
    }
    .mc-letter-preview { font-size: 13px; line-height: 1.5; color: var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space: pre-wrap; }
    .mc-letter-foot { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: var(--sub); }
    .mc-stamp { font-size: 9px; padding: 1px 7px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    /* 功能页：FAB / 列表 / 写弹层 / 详情浮层 */
    .mc-fab {
      position: fixed; bottom: 28px; right: 22px; z-index: 60;
      width: 54px; height: 54px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff;
      box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent);
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 26px; line-height: 1;
    }
    .mc-fab:active { transform: scale(.92); }
    .mc-page-note { max-width: none; }
    .mc-diary-card {
      background: var(--card); border-radius: 14px; padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.05); cursor: pointer;
    }
    .mc-diary-card:active { transform: scale(.985); }
    .mc-diary-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 11px; color: var(--sub); }
    .mc-badge-lock { background: color-mix(in srgb, #C4A574 16%, transparent); color: #C4A574; border-radius: 8px; padding: 1px 7px; font-size: 9px; }
    .mc-badge-visible { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border-radius: 8px; padding: 1px 7px; font-size: 9px; }
    .mc-badge-private { background: var(--border); color: var(--sub); border-radius: 8px; padding: 1px 7px; font-size: 9px; }
    .mc-diary-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .mc-diary-preview { font-size: 12px; color: var(--sub); line-height: 1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .mc-letter-page { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
    .mc-letter-page:active { transform: scale(.985); }
    /* 隐私模糊层（未投递信 / 私有机日记） */
    .mc-restricted { cursor: default; }
    .mc-restricted:active { transform: none; }
    .mc-diary-preview.mc-blur, .mc-letter-preview.mc-blur, .mc-detail-body.mc-blur {
      filter: blur(6px); user-select: none; pointer-events: none;
    }
    .mc-lock-label {
      margin-top: 8px; font-size: 11px; color: var(--sub);
      display: flex; align-items: center; gap: 4px;
      background: color-mix(in srgb, var(--accent2) 25%, transparent);
      border-radius: 8px; padding: 6px 8px;
    }
    .mc-detail-del {
      width: 100%; margin-top: 12px; padding: 9px; border-radius: 9px;
      border: 1px solid color-mix(in srgb, #C2574A 45%, var(--border));
      background: color-mix(in srgb, #C2574A 10%, var(--card));
      color: #C2574A; font-size: 13px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .mc-detail-del svg { width: 15px; height: 15px; }
    .mc-stamp-pending { background: color-mix(in srgb, #C4A574 18%, transparent); color: #C4A574; }
    .mc-sheet-mask {
      position: fixed; inset: 0; background: rgba(40,35,25,.35); z-index: 100;
      display: flex; align-items: flex-end; opacity: 0; visibility: hidden; transition: .22s;
    }
    .mc-sheet-mask.show { opacity: 1; visibility: visible; }
    .mc-sheet {
      width: 100%; background: var(--card); border-radius: 20px 20px 0 0;
      padding: 12px 20px 28px; transform: translateY(100%); transition: transform .28s cubic-bezier(.32,.72,0,1);
      max-height: 82vh; display: flex; flex-direction: column;
    }
    .mc-sheet-mask.show .mc-sheet { transform: translateY(0); }
    .mc-sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
    .mc-sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; text-align: center; color: var(--text); }
    .mc-sheet-input { flex: 1; min-height: 120px; border: none; background: transparent; font-family: inherit; font-size: 15px; line-height: 1.7; color: var(--text); resize: none; outline: none; }
    .mc-sheet-input::placeholder { color: var(--sub); opacity: .6; }
    .mc-sheet-time { flex: 1; height: 38px; border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; font-size: 13px; background: var(--bg); color: var(--text); outline: none; }
    .mc-sheet-actions { display: flex; gap: 10px; margin-top: 12px; }
    .mc-sheet-actions .btn { flex: 1; height: 42px; border-radius: 21px; border: none; font-size: 14px; cursor: pointer; }
    .mc-btn-cancel { background: var(--border); color: var(--sub); }
    .mc-btn-send { background: var(--accent); color: #fff; }
    .mc-detail-mask { position: fixed; inset: 0; background: rgba(40,35,25,.4); z-index: 100; overflow-y: auto; padding: 40px 16px 24px; }
    .mc-detail-card {
      max-width: 430px; width: 100%; margin: 0 auto; background: var(--card);
      border-radius: 16px; padding: 20px 18px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
      max-height: min(78vh, 640px); display: flex; flex-direction: column; overflow: hidden;
      box-sizing: border-box;
    }
    .mc-detail-card .mc-detail-body {
      flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      max-height: 42vh;
    }
    .mc-detail-mask {
      display: flex; align-items: center; justify-content: center;
    }
    .mc-detail-close { width: 32px; height: 32px; border-radius: 50%; border: none; background: var(--border); color: var(--text); cursor: pointer; font-size: 15px; }
    .mc-detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .mc-detail-body { font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-wrap; word-break: break-word; }
    .mc-ann-title { font-size: 11px; color: var(--sub); margin: 16px 0 8px; }
    .mc-ann-item { font-size: 12px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; line-height: 1.5; }
    .mc-ann-input-row { display: flex; gap: 8px; margin-top: 8px; }
    .mc-ann-input { flex: 1; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: 12px; outline: none; background: var(--bg); color: var(--text); }
    /* 券编辑器 */
    .coupon-editor { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin: 4px 0 18px; }
    .coupon-editor label { display: block; font-size: 11px; color: var(--sub); margin: 12px 0 6px; }
    .coupon-editor input, .coupon-editor textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; box-sizing: border-box;
      font-size: 13px; background: var(--bg); color: var(--text); outline: none;
    }
    .coupon-editor textarea { min-height: 54px; resize: vertical; }
    .coupon-swatches { display: flex; gap: 10px; flex-wrap: wrap; }
    .coupon-swatch { width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); cursor: pointer; box-sizing: border-box; position: relative; }
    .coupon-swatch.on { box-shadow: 0 0 0 2px var(--text, #333); }
    .coupon-pick-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .coupon-pick {
      border: 1px solid var(--border); border-radius: 20px; padding: 6px 14px; font-size: 12px;
      background: var(--bg); color: var(--text); cursor: pointer;
    }
    .coupon-pick.on { border-color: var(--text, #333); background: var(--text, #333); color: var(--bg, #fff); }
    .coupon-editor-actions { display: flex; gap: 10px; margin-top: 18px; }
    /* ── 语音消息 · 气泡内语音条 ── */
    .voice-bar { display: flex; align-items: center; gap: 8px; min-width: 190px; max-width: 250px; }
    .voice-play {
      width: 34px; height: 34px; border-radius: 50%; border: none; flex: none;
      background: var(--accent); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .15s;
    }
    .voice-play:active { transform: scale(.92); }
    .voice-play svg { width: 14px; height: 14px; fill: currentColor; }
    .bubble.me .voice-play { background: rgba(255,255,255,.22); color: #fff; }
    .voice-wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 26px; min-width: 0; }
    .voice-wave span {
      flex: 1; max-width: 4px; border-radius: 2px; background: rgba(127,127,127,.28);
      min-height: 2px; transition: background .15s;
    }
    .bubble.me .voice-wave span { background: rgba(255,255,255,.28); }
    .voice-wave span.on { background: var(--accent); }
    .bubble.me .voice-wave span.on { background: rgba(255,255,255,.85); }
    .voice-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex: none; }
    .voice-dur { font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
    .bubble.me .voice-dur { color: rgba(255,255,255,.65); }
    .voice-emo { font-size: 12px; line-height: 1; }
    .voice-text-toggle {
      font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px;
      border: 1px solid rgba(127,127,127,.35); background: transparent; color: var(--sub); cursor: pointer;
    }
    .bubble.me .voice-text-toggle { color: rgba(255,255,255,.7); border-color: rgba(255,255,255,.3); }
    .voice-text-toggle.on { background: var(--accent); color: #fff; border-color: transparent; }
    .voice-transcript { display: none; margin-top: 6px; font-size: 12px; color: var(--sub); line-height: 1.5; white-space: pre-wrap; word-break: break-word; max-width: 250px; }
    .voice-transcript.open { display: block; }
    .bubble.me .voice-transcript { color: rgba(255,255,255,.75); }
    /* ── 语音消息 · 录音浮条（body 级 overlay，独立于 render）── */
    .chat-voice-strip {
      position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom,0px) + 84px);
      transform: translateX(-50%); width: min(430px, 92vw); z-index: 9000;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.18); backdrop-filter: blur(12px);
    }
    .chat-voice-strip .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5a6e; flex: none; animation: cvPulse 1s ease-in-out infinite; }
    @keyframes cvPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.35;transform:scale(.8);} }
    .chat-voice-strip .rec-wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; min-width: 0; }
    .chat-voice-strip .rec-wave span { flex: 1; max-width: 4px; border-radius: 2px; background: var(--accent); height: 4px; transition: height .08s ease; }
    .chat-voice-strip .rec-timer { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; flex: none; min-width: 34px; text-align: right; }
    .chat-voice-strip .rec-hint { font-size: 11px; color: var(--sub); flex: none; max-width: 96px; text-align: right; }
    .chat-voice-strip .rec-stop {
      width: 32px; height: 32px; border-radius: 50%; border: none; background: #ff5a6e; color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none;
    }
    .chat-voice-strip .rec-stop:active { transform: scale(.92); }
    .chat-voice-strip .rec-stop svg { width: 12px; height: 12px; fill: #fff; }

    /* ═══ UI Shell · 像素农场风（星露谷向，纯 CSS，无额外素材） ═══ */
    body.shell-pixel {
      --px-soil: #5c4033;
      --px-wood: #8b5e3c;
      --px-wood2: #c4a574;
      --px-cream: #f7e8c3;
      --px-paper: #fff6dc;
      --px-grass: #4a7c3f;
      --px-grass2: #7cb068;
      --px-gold: #e0a824;
      --px-ink: #3a2a20;
      --px-muted: #7a654f;
      --px-border: #3d2918;
      --px-sky: #9ec9e0;
      --card: var(--px-paper);
      --bg: var(--px-cream);
      --text: var(--px-ink);
      --sub: var(--px-muted);
      --border: var(--px-wood);
      --accent: var(--px-grass);
      --accent2: var(--px-gold);
    }
    body.shell-pixel #app,
    body.shell-pixel .page,
    body.shell-pixel .home-panel {
      background-color: var(--px-cream) !important;
      background-image:
        linear-gradient(180deg, rgba(158,201,224,0.35) 0%, rgba(158,201,224,0) 28%),
        repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(74,124,63,0.06) 7px, rgba(74,124,63,0.06) 8px),
        repeating-linear-gradient(90deg, transparent, transparent 7px, rgba(92,64,51,0.05) 7px, rgba(92,64,51,0.05) 8px) !important;
      background-size: auto, 8px 8px, 8px 8px !important;
      image-rendering: pixelated;
    }
    body.shell-pixel .chat-page {
      background:
        linear-gradient(180deg, rgba(158,201,224,0.4) 0 48px, transparent 120px),
        repeating-linear-gradient(0deg, #e8d4a8 0 4px, #e2cca0 4px 8px) !important;
    }
    body.shell-pixel .chat-header,
    body.shell-pixel .sub-header,
    body.shell-pixel .chat-input-bar,
    body.shell-pixel .bottom-nav {
      background: var(--px-wood) !important;
      border: 3px solid var(--px-border) !important;
      border-radius: 0 !important;
      box-shadow:
        inset -3px -3px 0 #6e482e,
        inset 3px 3px 0 #b8895c,
        0 4px 0 var(--px-border) !important;
      color: var(--px-cream) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    body.shell-pixel .chat-header .chat-name,
    body.shell-pixel .chat-header .chat-status,
    body.shell-pixel .sub-header .page-title,
    body.shell-pixel .bottom-nav button {
      color: var(--px-cream) !important;
    }
    body.shell-pixel .bottom-nav {
      gap: 2px;
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0)) !important;
    }
    body.shell-pixel .bottom-nav button {
      border-radius: 0 !important;
      border: 2px solid var(--px-border) !important;
      background: var(--px-wood2) !important;
      color: var(--px-ink) !important;
      box-shadow: inset 2px 2px 0 #e8d4a8, inset -2px -2px 0 #8b5e3c !important;
      font-weight: 700;
      font-size: 11px;
    }
    body.shell-pixel .bottom-nav button.active {
      background: var(--px-gold) !important;
      color: var(--px-ink) !important;
      box-shadow: inset 2px 2px 0 #f5e6a8, inset -2px -2px 0 #b8860b !important;
    }
    /* 只描真正的 .bubble，不要碰到 .bubble-row（否则会双层框） */
    body.shell-pixel .chat-messages .bubble.me,
    body.shell-pixel .chat-messages .bubble.them,
    body.shell-pixel .bubble-row > .bubble {
      border-radius: 2px !important;
      border: 3px solid var(--px-border) !important;
      box-shadow: 3px 3px 0 rgba(61,41,24,0.35) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      font-size: 14px;
      line-height: 1.45;
    }
    body.shell-pixel .bubble-row {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }
    body.shell-pixel .chat-messages .bubble.me,
    body.shell-pixel .bubble-row.me > .bubble {
      background: #f0d78c !important;
      color: var(--px-ink) !important;
    }
    body.shell-pixel .chat-messages .bubble.them,
    body.shell-pixel .bubble-row.them > .bubble {
      background: var(--px-paper) !important;
      color: var(--px-ink) !important;
    }
    body.shell-pixel .chat-header {
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      justify-content: flex-start !important;
    }
    body.shell-pixel .chat-header .back-btn {
      color: var(--px-cream) !important;
    }
    body.shell-pixel .btn-accent,
    body.shell-pixel button.btn-accent {
      background: var(--px-grass) !important;

      <svg style="position:absolute;top:75%;right:20%;width:18px;height:18px;opacity:0;animation:splashBreath 3.9s ease-in-out infinite,splashFadeIn 1.5s ease 0.5s forwards;fill:none;stroke:#e8b4a0;stroke-width:1.2" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>

      <svg style="position:absolute;top:48%;right:10%;width:18px;height:18px;opacity:0;animation:splashBreath 3.7s ease-in-out infinite,splashFadeIn 1.5s ease 1.7s forwards;fill:none;stroke:#e8b4a0;stroke-width:1.2" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>

      <svg style="position:absolute;top:8%;right:35%;width:16px;height:16px;opacity:0;animation:splashBreath 4.2s ease-in-out infinite,splashFadeIn 1.5s ease 1.6s forwards;fill:none;stroke:#d4a08c;stroke-width:1.1" viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>
      <!-- 小圆点 -->

    " id="splash-brand-tag">every day with you</div>

  <!-- ═══════════════ 登录层 ═══════════════ -->
  <div id="login-screen" style="
    position:fixed;inset:0;z-index:99990;

  ">
    <div style="width:100%;max-width:320px;text-align:center">

        box-shadow:0 4px 16px rgba(212,165,165,0.4);

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat&family=Great+Vibes&family=Noto+Sans+SC:wght@300;400&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap');
    @keyframes splashGlow {
      0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}
      50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    }
    @keyframes splashBreath {
      0%,100%{transform:scale(0.92) translateY(0);opacity:0.35}
      50%{transform:scale(1.08) translateY(-4px);opacity:0.7}
    }
    @keyframes splashFadeIn {
      from{opacity:0;transform:scale(0.6)}
      to{opacity:0.5}
    }
    @keyframes splashContentIn {
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes splashNameBreath {
      0%,100%{transform:scale(1);opacity:0.95}
      50%{transform:scale(1.02);opacity:1}
    }
    @keyframes splashWelcomeIn {
      from{opacity:0;transform:translateY(12px);letter-spacing:0.5em}
      to{opacity:0.9;transform:translateY(0);letter-spacing:0.35em}
    }
    @keyframes splashLineIn {
      from{opacity:0;width:10px}
      to{opacity:0.6;width:40px}
    }
    @keyframes splashTagIn {
      from{opacity:0}
      to{opacity:0.7}
    }
    @keyframes splashDot {
      0%,100%{opacity:0;transform:translateY(0)}
      30%{opacity:0.4}
      70%{opacity:0.25}
      50%{transform:translateY(-15px)}
    }

    /* ═══ RPG 对话模式骨架 ═══ */
    .chat-view-switch {
      display: inline-flex; align-items: center; gap: 0;
      border: 1px solid var(--border); border-radius: 999px;
      overflow: hidden; flex-shrink: 0; margin-left: auto;
      background: var(--card);
      position: relative; z-index: 60;
      pointer-events: auto;
    }
    .chat-view-switch button {
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-view-switch button {
      border: none; background: transparent; color: var(--sub);
      font-size: 12px; font-weight: 700; padding: 5px 12px; cursor: pointer;
    }
    .chat-view-switch button.active {
      background: var(--accent); color: #fff;
    }
    body.shell-pixel .chat-view-switch {
      border: 2px solid var(--px-border); border-radius: 0; background: var(--px-wood2);
    }
    body.shell-pixel .chat-view-switch button { color: var(--px-ink); }
    body.shell-pixel .chat-view-switch button.active {
      background: var(--px-gold); color: var(--px-ink);
    }
    .rpg-stage {
      position: relative; flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      background: #1a1520;
    }
    .rpg-bg {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      filter: brightness(0.72);
    }
    .rpg-bg::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,8,16,0.15) 0%, rgba(10,8,16,0.55) 55%, rgba(10,8,16,0.82) 100%);
    }
    .rpg-stage-body {
      position: relative; z-index: 1; flex: 1; min-height: 0;
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 12px 14px 8px;
    }
/* 乙游布局：他说话左侧立绘，我说话右侧立绘 */
    .rpg-sprite-slot {
      position: absolute;
      bottom: calc(132px + env(safe-area-inset-bottom, 0px));
      transform: none;
      width: min(72vw, 340px);
      height: min(68vh, 620px);
      display: flex; align-items: flex-end;
      pointer-events: none; z-index: 1;
      overflow: visible;
    }
    .rpg-sprite-slot.them {
      left: max(-12px, env(safe-area-inset-left, 0px) - 8px);
      right: auto;
      justify-content: flex-start;
      width: min(78vw, 380px);
    }
    .rpg-sprite-slot.them .rpg-avatar-full {
      object-position: bottom left !important;
      transform: translateX(-6%);
    }
    .rpg-sprite-slot.me {
      right: max(-8px, env(safe-area-inset-right, 0px) - 4px);
      left: auto;
      justify-content: flex-end;
      width: min(78vw, 380px);
    }
    .rpg-sprite-slot.me .rpg-avatar-full {
      object-position: bottom right !important;
      transform: translateX(4%);
    }
    .rpg-sprite-slot .rpg-avatar {
      width: 120px; height: 120px; border-radius: 50%;
      object-fit: cover; border: 3px solid rgba(255,255,255,0.35);
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.12);
    }
    .rpg-sprite-slot .rpg-avatar-fallback {
      width: 100px; height: 100px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px; background: rgba(255,255,255,0.15);
      border: 3px solid rgba(255,255,255,0.3);
      color: #fff;
    }
    .rpg-dialog {
      position: relative; z-index: 2;
      background: rgba(12, 14, 22, 0.78);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 14px 16px 12px;
      color: #f4f0ea;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 10px 36px rgba(0,0,0,0.35);
      min-height: 110px;
      cursor: pointer;
      user-select: none;
    }
    body.shell-pixel .rpg-dialog {
      border-radius: 0; border: 3px solid #2a2018;
      background: rgba(40, 28, 18, 0.88);
      backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .rpg-dialog-name {
      display: inline-block;
      font-size: 12px; font-weight: 800; letter-spacing: 0.06em;
      color: #fff; background: rgba(255,255,255,0.12);
      padding: 3px 10px; border-radius: 999px; margin-bottom: 8px;
    }
    body.shell-pixel .rpg-dialog-name {
      border-radius: 0; border: 2px solid #3d2918; background: #8b5e3c;
    }
    .rpg-dialog-text {
      font-size: 15px; line-height: 1.65; color: #f7f3ec;
      white-space: pre-wrap; word-break: break-word;
      min-height: 3.2em;
    }
    .rpg-dialog-foot {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.55);
    }
    .rpg-dialog-foot .blink { animation: rpgBlink 1.2s ease-in-out infinite; }
    @keyframes rpgBlink { 0%,100%{ opacity:0.35 } 50%{ opacity:1 } }
    .rpg-toolbar {
      position: relative; z-index: 2;
      display: flex; gap: 8px; padding: 8px 4px 4px;
      flex-wrap: wrap;
    }
    .rpg-toolbar button {
      flex: 1; min-width: 72px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.35);
      color: #f0ebe3; border-radius: 12px;
      padding: 8px 10px; font-size: 12px; font-weight: 700;
      cursor: pointer;
    }
    body.shell-pixel .rpg-toolbar button {
      border-radius: 0; border: 2px solid #3d2918; background: #5c4033;
    }
    .rpg-hist-mask {
      position: absolute; inset: 0; z-index: 5;
      background: rgba(0,0,0,0.55);
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    .rpg-hist-panel {
      max-height: 70%; background: rgba(16,14,20,0.94);
      border-radius: 18px 18px 0 0; border: 1px solid rgba(255,255,255,0.12);
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    body.shell-pixel .rpg-hist-panel {
      border-radius: 0; border: 3px solid #3d2918; background: #2a2018;
    }
    .rpg-hist-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.1);
      color: #fff; font-weight: 800; font-size: 14px;
    }
    .rpg-hist-body {
      overflow: auto; padding: 12px 14px 18px;
      -webkit-overflow-scrolling: touch;

    /* ═══ 选择题：普通聊天选项卡 + RPG 横条 ═══ */

    /* RPG 舞台：触须/藤蔓感装饰（纯 CSS） */
    body.shell-eldritch .rpg-stage {
      background: #08060c !important;
    }
    body.shell-eldritch .rpg-bg::after {
      background:
        linear-gradient(180deg, rgba(8,6,12,0.2) 0%, rgba(8,6,12,0.55) 50%, rgba(8,6,12,0.88) 100%),
        radial-gradient(ellipse 50% 30% at 90% 70%, rgba(40, 90, 60, 0.15), transparent 70%) !important;
    }
    body.shell-eldritch .rpg-dialog {
      background: linear-gradient(180deg, rgba(18, 14, 24, 0.94), rgba(10, 8, 14, 0.96)) !important;
      border: 1px solid rgba(90, 130, 100, 0.45) !important;
      border-radius: 4px 16px 4px 16px !important;

        0 0 0 1px rgba(40, 30, 50, 0.8),

    body.shell-eldritch .rpg-dialog::before,
