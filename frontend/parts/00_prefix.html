<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>baileys</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
  <style>

    /* ── 三套自定义字体 ── */
    @font-face {
      font-family: 'NailCatBell';
      src: url('Nail-猫猫铃1.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'NailAngelClinic';
      src: url('Nail·天使诊所8.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'NaiKitten';
      src: url('奈の小猫8.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    body.font-nail { font-family: 'NailCatBell', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    body.font-angel { font-family: 'NailAngelClinic', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    body.font-noto-kr, body.font-noto-kr * { font-family: "Noto Sans KR", "Noto Sans SC", -apple-system, sans-serif !important; }
    body.font-noto-sc, body.font-noto-sc * { font-family: "Noto Sans SC", "Noto Sans KR", -apple-system, sans-serif !important; }
    body.font-kitten { font-family: 'NaiKitten', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

    /* 三款日系血统的中文字体（都是 OFL 开源，日文名作的简体中文化）：
         霞鹜文楷 Screen ← Klee One，屏幕加粗版（原版 Regular 在安卓上偏细）
         小赖 ← 濑户字体，44246 字，三个里字最全
         悠哉 ← Y.OzFont
       字体表走 jsdelivr 的 cn-fontsource 包，**选中时才由 ensureCnFont() 插 link**——
       每个包的 font.css 有几百条 @font-face，三个一起 @import 会拖慢每次冷启动，
       而她同时只可能用一个。woff2 本身按 unicode-range 分片，用到哪个字才下哪片。
       故意不写 `body.font-xxx *`：那样会连书房的批注手写体、蓝晒壳的等宽字一起盖掉。
       只设 body 让子元素自己继承，自带字体的地方保持原样。 */
    body.font-wenkai  { font-family: 'LXGW WenKai Screen', 'PingFang SC', 'Microsoft YaHei', serif; }
    body.font-xiaolai { font-family: 'Xiaolai SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    body.font-yozai   { font-family: 'Yozai', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

    .font-switch-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .font-chip {
      border: 1px solid var(--border); background: var(--card); color: var(--sub);
      border-radius: 16px; padding: 6px 14px; font-size: 12px; cursor: pointer;
      transition: all 0.15s;
    }
    .font-chip.active {
      border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: 'Noto Sans KR', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #F5EEE8;
      overscroll-behavior: none;
      overflow: hidden;
    }
    /* 文档本身永远不滚动，只有内部容器滚。
       以前 body 是可滚的：键盘弹起后布局视口没变、可视视口缩了，
       往下一拖就把整个文档拖上去，输入框和键盘之间露出一大片空白。
       钉死之后那块空白没地方可露。 */
    body {
      position: fixed;
      inset: 0;
      width: 100%;
    }
    #app {
      max-width: 480px;
      margin: 0 auto;
      height: var(--app-height, 100dvh);
      max-height: var(--app-height, 100dvh);
      min-height: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
      /* 顶栏自己吃掉安全区并铺色，这里不再空出一条异色带 */
      padding-top: 0;
    }
    button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button, a, [data-sub], [data-tab] { touch-action: manipulation; }
    input, textarea, select { font-family: inherit; }
    textarea { resize: none; }

    /* ── 手感：统一的按下反馈 ────────────────────────────────────────
       全站几百个可点元素，之前只有 30 来个写了 :active，其余按下去毫无反应，
       在手机上就显得「按了没反应 / 迟钝」。这里给一个统一的兜底：
       按下轻微回弹 + 压暗一点。个别组件自己写了 :active 的仍然优先。 */
    button, [role="button"], [data-sub], [data-tab], [data-tab-jump],
    .chip, .feat-card, .card-btn, .theme-chip, .font-chip, .filter-chip, .game-btn {
      transition: transform .11s cubic-bezier(.2,.7,.3,1), opacity .11s ease;
    }
    button:active, [role="button"]:active, [data-sub]:active, [data-tab]:active,
    [data-tab-jump]:active, .feat-card:active, .theme-chip:active,
    .font-chip:active, .filter-chip:active, .game-btn:active {
      transform: scale(.965);
      opacity: .82;
    }
    button:disabled:active, button[disabled]:active {
      transform: none; opacity: .5;
    }
    /* 长按 UI 不要选中文字；消息正文仍然可选可复制 */
    button, .bottom-nav, .sub-header, .chat-header, .theme-chip, .font-chip, .filter-chip {
      -webkit-user-select: none; user-select: none;
    }
    /* 内层滚动到头时不要把整页一起拖动 */
    .chat-messages, .page, .puppy-overlay-card, .think-modal-body {
      overscroll-behavior: contain;
    }
    /* 键盘焦点要看得见（之前 outline 全靠浏览器默认，暗色主题下几乎看不到） */
    button:focus-visible, a:focus-visible, input:focus-visible,
    textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--accent, #8a6a55);
      outline-offset: 2px;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
      button:active, [role="button"]:active, [data-sub]:active, [data-tab]:active,
      [data-tab-jump]:active, .feat-card:active, .theme-chip:active,
      .font-chip:active, .filter-chip:active, .game-btn:active { transform: none; }
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }


    /* ── 聊天侧边栏 ── */
    .chat-sidebar-mask {
      position: fixed; inset: 0; z-index: 80;
      background: rgba(30,24,20,.28);
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .chat-sidebar-mask.open { opacity: 1; pointer-events: auto; }
    .chat-sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 81;
      width: min(320px, 88vw);
      background: var(--card);
      border-right: 1px solid var(--border);
      box-shadow: 8px 0 28px rgba(0,0,0,.12);
      display: flex; flex-direction: column;
      transform: translateX(-105%);
      transition: transform .28s cubic-bezier(.32,.72,0,1);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .chat-sidebar.open { transform: translateX(0); }
    .chat-sidebar-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .chat-sidebar-head .sb-title { flex: 1; font-size: 15px; font-weight: 700; color: var(--text); }
    .chat-sidebar-head .sb-close {
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg); color: var(--sub); cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .chat-sidebar-body {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .sb-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    .sb-card-label {
      font-size: 10px; color: var(--sub); letter-spacing: .06em; margin-bottom: 6px;
      text-transform: uppercase;
    }
    .sb-clock {
      font-size: 28px; font-weight: 700; color: var(--text);
      font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.15;
    }
    .sb-clock-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .sb-weather-row { display: flex; align-items: center; gap: 10px; }
    .sb-temp { font-size: 26px; font-weight: 700; color: var(--text); }
    .sb-weather-meta { flex: 1; min-width: 0; font-size: 12px; color: var(--sub); line-height: 1.45; }
    .sb-section-title {
      font-size: 12px; font-weight: 700; color: var(--text); margin: 4px 0 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .sb-section-title button {
      border: none; background: transparent; color: var(--accent); font-size: 11px; cursor: pointer;
    }
    .sb-file-list { display: flex; flex-direction: column; gap: 8px; }
    .sb-file-item {
      display: flex; align-items: center; gap: 10px; text-align: left; width: 100%;
      padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer;
    }
    .sb-file-item:active { transform: scale(.98); }
    .sb-file-ico {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 15px;
    }
    .sb-file-meta { flex: 1; min-width: 0; }
    .sb-file-name {
      font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sb-file-sub { font-size: 10px; color: var(--sub); margin-top: 2px; }
    .sb-empty { font-size: 12px; color: var(--sub); text-align: center; padding: 16px 8px; line-height: 1.5; }
    .sb-quota-wrap { margin-top: 8px; padding-top: 4px; }
    .sb-quota-row { margin-bottom: 12px; }
    .sb-quota-head {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 12px; color: var(--text); margin-bottom: 6px;
    }
    .sb-quota-head span { color: var(--sub); font-size: 11px; }
    .sb-quota-bar {
      height: 8px; border-radius: 4px; background: var(--border); overflow: hidden;
    }
    .sb-quota-fill {
      height: 100%; border-radius: 4px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      width: 0%; transition: width .35s ease;
    }
    .sb-quota-hint { font-size: 10px; color: var(--sub); margin-top: 10px; line-height: 1.45; opacity: .85; }
    .sb-file-preview-mask {
      position: fixed; inset: 0; z-index: 90; background: rgba(30,24,20,.4);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .sb-file-preview {
      width: 100%; max-width: 420px; max-height: 78vh; overflow: hidden;
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.2);
    }
    .sb-file-preview-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .sb-file-preview-head .t { flex: 1; font-size: 13px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-file-preview-body {
      flex: 1; min-height: 0; overflow-y: auto; padding: 14px;
      font-size: 13px; line-height: 1.6; color: var(--text); white-space: pre-wrap; word-break: break-word;
    }
    .sb-file-preview-body img { max-width: 100%; border-radius: 10px; display: block; }

    /* Project 文件卡 · 牛仔信封素材 */
    .proj-file-card {
      position: relative;
      width: min(268px, 82vw);
      aspect-ratio: 1.15 / 1;
      border: none; padding: 0; margin: 4px 0 8px;
      background: transparent; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.18));
      transition: transform .15s ease;
    }
    .proj-file-card:active { transform: scale(.97); }
    .proj-file-card-bg {
      position: absolute; inset: 0;
      background: url('envelope-file-card.jpg') center / contain no-repeat;
      pointer-events: none;
    }
    .proj-file-card-label {
      position: absolute;
      left: 14%; right: 14%;
      top: 18%; height: 38%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 6px 10px;
      color: #3a3a42; pointer-events: none;
    }
    .proj-file-card-name {
      font-size: 13px; font-weight: 700; line-height: 1.35;
      max-width: 100%; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      word-break: break-all;
    }
    .proj-file-card-hint {
      margin-top: 6px; font-size: 10px; color: #6a6a78; letter-spacing: .04em;
    }
    .proj-file-card-badge {
      margin-top: 4px; font-size: 9px; color: #5a6a8a;
      background: rgba(255,255,255,.55); border-radius: 999px; padding: 2px 8px;
    }


    .sb-file-preview.sb-preview-wide {
      max-width: min(960px, 96vw); width: 96vw; max-height: 90vh; height: 90vh;
    }
    .sb-file-preview-body.sb-code {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
      background: var(--bg); border-radius: 0 0 16px 16px;
    }
    .sb-html-frame-wrap {
      flex: 1; min-height: 0; background: #fff; position: relative;
    }
    .sb-html-frame-wrap iframe {
      width: 100%; height: 100%; border: 0; display: block; background: #fff;
    }
    .sb-html-run-mask {
      position: fixed; inset: 0; z-index: 95;
      background: rgba(20,16,14,.45);
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    }
    .sb-html-run-bar {
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; background: var(--card); border-bottom: 1px solid var(--border);
    }
    .sb-html-run-bar .t {
      flex: 1; font-size: 13px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sb-html-run-body { flex: 1; min-height: 0; background: #fff; }
    .sb-html-run-body iframe { width: 100%; height: 100%; border: 0; display: block; }


    /* 底部导航 — 仅 3 项 */
    .bottom-nav {
      position: sticky; bottom: 0; display: flex; flex-shrink: 0;
      background: var(--card); border-top: 1px solid var(--border);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      /* 这里原来有句 backdrop-filter: blur(12px)：底色是不透明的 --card，模糊不到
         任何东西，只白白多合成一个 GPU 层。真正需要模糊时由下面的 ui-glass-* 规则给。 */
      box-shadow: 0 -1px 8px rgba(0,0,0,0.05);
    }
    .bottom-nav button {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 6px 0 4px; border: none; background: transparent; cursor: pointer;
      color: var(--sub); font-size: 9px; font-weight: 400; transition: all 0.2s;
      min-height: 0;
    }
    .bottom-nav button.active { color: var(--accent); font-weight: 700; }
    .bottom-nav button .icon { font-size: 16px; line-height: 1; }

    .page { padding: 8px 20px 64px; flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .page-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 2px; }
    .page-sub { font-size: 11px; color: var(--sub); margin-bottom: 24px; }

    /* ── 首页滑动容器：三页高度锁定视口，各自独立上下滚 ── */
    .home-swipe-wrap {
      flex: 1;
      min-height: 0;          /* 关键 flex 子项被内容撑开 */
      overflow: hidden;
      position: relative;
      touch-action: pan-y;
      height: 100%;
    }
    .home-track {
      display: flex;
      width: 300%;
      height: 100%;           /* 高度=视口，不再被功能页内容撑高 */
      transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      will-change: transform;
    }
    .home-track.page0 { transform: translateX(0); }
    .home-track.page1 { transform: translateX(-33.333%); }
    .home-track.page2 { transform: translateX(-66.666%); }
    .home-panel {
      pointer-events: auto;
      width: 33.333%;
      flex-shrink: 0;
      height: 100%;
      min-height: 0;
      padding: 8px 20px 56px;
      padding-top: max(8px, env(safe-area-inset-top, 0px));
      overflow-x: hidden;
      overflow-y: auto;       /* 只有当前页自己滚 */
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    /* 聊天热力日历 */
    .heat-summary {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 12px 14px; margin-bottom: 14px; font-size: 11px; color: var(--sub); line-height: 1.65;
    }
    .heat-summary strong { color: var(--text); font-weight: 700; }
    .heat-day {
      aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 11px; color: var(--text);
      border: 1px solid var(--border); position: relative; padding: 2px;
      background: var(--card); min-height: 44px;
    }
    .heat-day.today { border: 2px solid var(--accent); }
    .heat-day .heat-count { font-size: 9px; font-weight: 700; margin-top: 1px; line-height: 1; }
    .heat-day .heat-mood { font-size: 12px; line-height: 1; margin-top: 1px; }
    .heat-lv0 { background: var(--card); color: var(--sub); }
    .heat-lv1 { background: color-mix(in srgb, var(--accent) 18%, var(--card)); }
    .heat-lv2 { background: color-mix(in srgb, var(--accent) 35%, var(--card)); }
    .heat-lv3 { background: color-mix(in srgb, var(--accent) 55%, var(--accent2)); color: var(--text); font-weight: 600; }
    .heat-lv4 { background: color-mix(in srgb, var(--accent) 78%, #c45); color: #fff; font-weight: 700; border-color: transparent; }
    .feat-section-label {
      font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: 0.5px;
      margin: 14px 0 8px; padding-left: 2px;
    }
    .feat-section-label:first-child { margin-top: 4px; }
    .duty-day {
      aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 11px; color: var(--text);
      border: 1px solid var(--border); background: var(--card); min-height: 40px; cursor: pointer;
      position: relative;
    }
    .duty-day.scheduled { border-style: dashed; border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .duty-day.done {
      background: color-mix(in srgb, var(--accent) 55%, var(--card));
      color: #fff; font-weight: 700; border-color: transparent;
    }
    .duty-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
    .duty-day .duty-mark { font-size: 10px; line-height: 1; margin-top: 1px; }
    .duty-modal-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 120;
      display: flex; align-items: flex-end; justify-content: center;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .duty-modal {
      width: 100%; max-width: 420px; background: var(--card); border-radius: 18px 18px 0 0;
      padding: 0; border: 1px solid var(--border); border-bottom: none;
      max-height: 72vh; display: flex; flex-direction: column;
      box-shadow: 0 -8px 32px rgba(0,0,0,0.12);
    }
    .duty-modal-body {
      flex: 1; overflow-y: auto; padding: 16px 16px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .duty-modal-foot {
      flex-shrink: 0; padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border); background: var(--card);
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    /* ─── 每日任务面板 + 聊天任务弹窗（bdsm-daily-quest-page 组件化）── */
    .quest-head { text-align: center; padding: 6px 0 4px; margin-bottom: 4px; }
    .quest-head-title { font-size: 17px; letter-spacing: .1em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    .quest-head-date { font-size: 12px; color: var(--sub); font-family: ui-monospace, monospace; margin-bottom: 6px; }
    .quest-head-greet { font-size: 14px; color: var(--text); line-height: 1.45; margin-bottom: 4px; }

    /* ─── 飞行棋（flight-chess-v3 / flight-chess-popup 组件化）── */

    .fc-board { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 8px 12px; }

    .fc-cell {
      aspect-ratio: 1/1; border-radius: 6px; border: 1px solid var(--border);
      background: color-mix(in srgb, var(--card) 60%, var(--bg));
      font-size: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 1px; position: relative; line-height: 1.1; color: var(--text); overflow: hidden;
    }

    .fc-cell.end { background: color-mix(in srgb, var(--accent2) 40%, var(--card)); border-color: color-mix(in srgb, var(--accent2) 55%, var(--border)); font-weight: 600; font-size: 9px; }
    .fc-cell.special { background: color-mix(in srgb, var(--accent2) 22%, var(--card)); border-color: color-mix(in srgb, var(--accent2) 38%, var(--border)); }
    .fc-num { position: absolute; top: 1px; left: 2px; font-size: 7px; color: var(--sub); font-family: ui-monospace, monospace; }
    .fc-piece { width: 9px; height: 9px; border-radius: 50%; position: absolute; bottom: 2px; border: 1px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); }

    /* 飞行棋聊天弹窗 */
    .fc-popup-mask {

    .fc-event-layer { position: absolute; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; border-radius: 18px; z-index: 3; }

    /* ─── 真心话大冒险（truth-or-dare 移植 · CSS 卡背）── */

      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 18px; overflow: hidden;
    }
    /* CSS 卡背：真心话=深酒红+金色火焰；大冒险=米白+心形锁 */
    .td-back-truth { background: radial-gradient(circle at 50% 30%, #b33a2a 0%, #6e1a12 45%, #3a0d08 100%); }
    .td-back-truth::after {
      content: ""; position: absolute; inset: 9px; border-radius: 9px;
      border: 2px solid rgba(255,180,60,.5);
      background: radial-gradient(circle at 50% 68%, rgba(255,150,50,.28), transparent 62%);
    }
    .td-back-dare { background: radial-gradient(circle at 50% 30%, #fff8ec 0%, #e8d8c0 50%, #c2ab8d 100%); }
    .td-back-dare::after {
      content: "♥"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 46px; color: #b84a3a; opacity: .8;
    }
    .td-back-truth::before { content: "真心话"; position: absolute; bottom: 18px; width: 100%; text-align: center; font-size: 11px; letter-spacing: .22em; color: rgba(245,230,211,.65); }
    .td-back-dare::before { content: "大冒险"; position: absolute; bottom: 18px; width: 100%; text-align: center; font-size: 11px; letter-spacing: .22em; color: rgba(74,53,40,.6); }
    .td-front { background: #2a1f1c; border: 2px solid #c9a227; transform: rotateY(180deg); color: #f5e6d3; text-align: center; }
    .td-front.td-dare-front { background: #f7f0e6; border-color: #b08d6a; color: #4a3528; }
    .td-card.td-flipped { transform: rotateY(180deg); }
    .td-type-label { font-size: .7rem; letter-spacing: .15em; margin-bottom: 14px; opacity: .75; }
    .td-content { font-size: .9rem; line-height: 1.55; font-weight: 500; }
    .td-mode-row { display: flex; gap: 8px; width: 100%; }
    .td-mode-btn {
      flex: 1; padding: 9px; border-radius: 10px; border: 1.5px solid #5a4030;
      background: #2a1f1c; color: #c9a227; font-size: .85rem; font-weight: 600; cursor: pointer;
    }
    .td-mode-btn.td-active { background: #c9a227; color: #1a1210; border-color: #c9a227; }
    .td-mode-btn.td-dare-mode.td-active { background: #b08d6a; border-color: #b08d6a; color: #1a1210; }
    .td-mode-btn.td-mixed-mode.td-active { background: linear-gradient(135deg,#a24d8f,#c9a227); border-color: #a24d8f; color: #1a1210; }
    .td-action-row { display: flex; gap: 8px; width: 100%; margin-top: 10px; }
    .td-btn { flex: 1; padding: 12px; border-radius: 12px; border: none; font-size: .9rem; font-weight: 600; cursor: pointer; letter-spacing: .05em; }
    .td-btn-shuffle { background: #3d2a22; color: #d4a84b; border: 1px solid #5a4030; }
    .td-btn-draw { background: linear-gradient(135deg,#c9a227,#a67c00); color: #1a1210; }
    .td-btn-draw:disabled, .td-btn-ai-draw:disabled { opacity: .4; cursor: not-allowed; }
    .td-btn-ai-draw { background: linear-gradient(135deg,#3e7a5c,#2c5b43); color: #f0ead8; }
    /* 混合模式卡背：深酒红 → 紫 → 墨 */
    .td-back-mixed { background: linear-gradient(160deg,#6e1a12 0%, #5a2a4a 45%, #2a1f1c 100%); }
    .td-back-mixed::after { content: "混"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; color: rgba(245,230,211,.7); }
    .td-back-mixed::before { content: "真心话 · 大冒险"; position: absolute; bottom: 18px; width: 100%; text-align: center; font-size: 10px; letter-spacing: .18em; color: rgba(245,230,211,.55); }
    .td-hint { font-size: .75rem; color: #8a7a6a; margin-top: 8px; text-align: center; }
    @keyframes tdShuffle {
      0% { transform: translate(0,0) rotate(0); }
      30% { transform: translate(var(--rx,8px), var(--ry,-6px)) rotate(var(--rot,6deg)); }
      70% { transform: translate(calc(var(--rx,8px) * -0.5), calc(var(--ry,-6px) * -0.5)) rotate(calc(var(--rot,6deg) * -0.5)); }
      100% { transform: translate(0,0) rotate(0); }
    }
    .td-deck-area.td-shuffling .td-card { animation: tdShuffle .7s ease-out; }
    .td-drawn-wrap {
      position: fixed; inset: 0; z-index: 2100; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.72); flex-direction: column; gap: 18px;
    }
    .td-drawn-wrap .td-card { position: relative; }
    .td-drawn-close { padding: 9px 22px; border-radius: 20px; border: 1px solid #5a4030; background: #2a1f1c; color: #d4a84b; font-size: .85rem; cursor: pointer; }
    /* 抽到的卡发进聊天页的迷你卡气泡 */
    .td-chat-card {
      display: inline-flex; flex-direction: column; align-items: flex-start;
      min-width: 140px; max-width: 220px; border-radius: 12px; padding: 10px 12px;
      border: 1.5px solid;
    }
    .td-chat-card.truth { background: linear-gradient(160deg,#6e1a12,#3a0d08); border-color: #a34a2a; color: #f5e6d3; }
    .td-chat-card.dare { background: linear-gradient(160deg,#fff8ec,#e8d8c0); border-color: #b08d6a; color: #4a3528; }
    .td-chat-tag { font-size: 10px; letter-spacing: .18em; opacity: .8; margin-bottom: 5px; }
    .td-chat-text { font-size: 12.5px; line-height: 1.5; font-weight: 500; }
    .td-chat-from { font-size: 10px; opacity: .65; margin-top: 6px; }
    /* ─── 流式输出：实时气泡 ─── */
    .stream-think-wrap { border-bottom: 1px dashed var(--border); margin-bottom: 6px; padding-bottom: 6px; }
    .stream-think-label { font-size: 10px; color: var(--sub); display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .stream-think-label svg { width: 11px; height: 11px; }
    .stream-think-body { font-size: 12px; color: var(--sub); line-height: 1.5; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    .stream-body { white-space: pre-wrap; word-break: break-word; }
    .stream-cursor { display: inline-block; width: 7px; height: 13px; background: var(--accent); border-radius: 2px; margin-left: 2px; vertical-align: -2px; animation: stream-blink 1s steps(2) infinite; }
    @keyframes stream-blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    /* 记忆整理选择弹窗 */
    .mem-int-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 130;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .mem-int-modal {
      width: 100%; max-width: 360px; background: var(--card); border-radius: 18px;
      border: 1px solid var(--border); padding: 18px 16px 16px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    .nursery-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px 14px 12px; margin-bottom: 12px; position: relative;
    }
    .nursery-stamp {
      position: absolute; top: 10px; right: 12px; width: 40px; height: 40px;
      border: 2px solid color-mix(in srgb, var(--accent) 70%, #c45); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: color-mix(in srgb, var(--accent) 80%, #c45);
      transform: rotate(12deg); opacity: 0.85;
    }
    .stat-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; color: var(--text); }
    .stat-row .lab { width: 36px; color: var(--sub); flex-shrink: 0; }
    .stat-dots { display: flex; gap: 3px; flex: 1; }
    .stat-dots i {
      width: 12px; height: 12px; border-radius: 3px; background: var(--border);
      display: inline-block;
    }
    .stat-dots i.on-mood { background: #f2a0a8; }
    .stat-dots i.on-health { background: #8ecf9a; }
    .stat-dots i.on-bond { background: #e88b8b; }
    .stat-dots i.on-full { background: #7eb6e8; }
    .nursery-acts {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0;
    }
    .nursery-act {
      background: var(--card); border: 1px dashed var(--border); border-radius: 12px;
      padding: 10px 4px; font-size: 11px; color: var(--text); text-align: center;
    }
    .nursery-act .ic { font-size: 18px; display: block; margin-bottom: 4px; }
    .nursery-feed-item {
      background: color-mix(in srgb, var(--card) 90%, var(--accent2));
      border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px;
    }
    .nursery-feed-item.urgent {
      border-color: color-mix(in srgb, #c45 40%, var(--border));
      background: color-mix(in srgb, #c45 8%, var(--card));
    }
    .nursery-feed-item.dark {
      border-color: color-mix(in srgb, #888 30%, var(--border));
      background: color-mix(in srgb, #333 5%, var(--card));
    }
    .nursery-feed-item.milestone {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
      background: color-mix(in srgb, var(--accent2) 20%, var(--card));
    }
    .stat-dots i.on-mood   { background: #f2a0a8; }
    .stat-dots i.on-darkness { background: #b0a0b8; }
    .char-grid {
      display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 8px;
    }
    .char-grid span {
      aspect-ratio: 1; border: 1px solid var(--border); border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    .milestone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .milestone-card {
      background: var(--card); border: 1px dashed var(--border); border-radius: 12px;
      padding: 10px; font-size: 12px; color: var(--text); min-height: 72px;
    }
    .milestone-card .t { font-size: 10px; color: var(--sub); margin-top: 6px; }
    .watch-float {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: color-mix(in srgb, var(--card) 92%, var(--accent));
      border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .watch-float .wf-meta { flex: 1; min-width: 0; color: var(--text); }
    .watch-float .wf-t { color: var(--sub); font-size: 10px; }
    .read-progress {
      height: 4px; background: var(--border); border-radius: 2px; margin: 8px 0 4px; overflow: hidden;
    }
    .read-progress > i { display: block; height: 100%; background: var(--accent); border-radius: 2px; width: 0%; }
    .swipe-hint {
      text-align: center; font-size: 10px; color: var(--sub); opacity: 0.5;
      margin-top: 20px; letter-spacing: 1px;
    }
    .swipe-dots {
      display: flex; justify-content: center; gap: 6px; margin-top: 12px;
    }
    .swipe-dot {
      width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative;
    }
    .swipe-dot::before {
      content: ""; display: block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--border); transition: all 0.25s;
    }
    .swipe-dot.on::before { background: var(--accent); width: 16px; border-radius: 3px; }

    /* 首页内容 */
    .home-avatars { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
    .avatar-circle {
      border-radius: 50%; border: 2px solid var(--accent); overflow: hidden;
      background: var(--accent2); display: flex; align-items: center; justify-content: center;
    }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    .home-names { display: flex; justify-content: center; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .home-names span { font-size: 12px; color: var(--sub); }
    .days-block { text-align: center; margin-bottom: 4px; }
    .days-label { font-size: 10px; letter-spacing: 4px; color: var(--sub); margin-bottom: 6px; text-transform: uppercase; }
    .days-num { font-size: 72px; font-weight: 800; color: var(--text); line-height: 1; font-variant-numeric: tabular-nums; }
    .days-unit { font-size: 14px; color: var(--sub); margin-top: 2px; }
    .days-date { font-size: 11px; color: var(--sub); margin-top: 6px; opacity: 0.7; }
    .status-card {
      margin-top: 24px; background: var(--card); border-radius: 16px; padding: 16px 20px;
      border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    }
    .status-label { font-size: 11px; color: var(--sub); margin-bottom: 8px; }
    .status-row { display: flex; justify-content: space-between; align-items: center; }
    .status-text { font-size: 14px; color: var(--text); }
    .status-edit-btn { background: transparent; border: none; color: var(--sub); font-size: 11px; cursor: pointer; }
    .status-updated { font-size: 10px; color: var(--sub); margin-top: 6px; opacity: 0.6; }
    .home-footer { text-align: center; margin-top: 28px; font-size: 10px; color: var(--sub); opacity: 0.5; letter-spacing: 1px; }

    /* 功能页网格 — 小长条双列 */
    .feat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px;
    }
    .feat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px 14px; text-align: left; cursor: pointer; pointer-events: auto; position: relative; z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: transform 0.15s, box-shadow 0.15s;
      display: flex; align-items: center; gap: 10px;
    }
    .feat-card:active { transform: scale(0.97); }
    .feat-icon {
      width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
      background: color-mix(in srgb, var(--accent) 15%, transparent);
    }
    .feat-label { font-size: 13px; font-weight: 600; color: var(--text); }
    .feat-desc { font-size: 10px; color: var(--sub); margin-top: 2px; }

    /* 子页面顶栏返回 — sticky 顶死，翻页/滚动不带走，玻璃底盖住滚过内容 */
    .sub-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
      position: sticky; top: 0; z-index: 20;
      margin-left: -20px; margin-right: -20px;
      padding: 10px 20px 10px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* 日记 */
    .month-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 16px; }
    .month-nav button {
      background: var(--card); border: 1px solid var(--border); border-radius: 50%;
      width: 32px; height: 32px; cursor: pointer; color: var(--sub); font-size: 14px;
    }
    .month-nav span { font-size: 15px; font-weight: 600; color: var(--text); }
    .week-header, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .week-header { margin-bottom: 8px; }
    .week-header div { text-align: center; font-size: 11px; color: var(--sub); padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 11px; color: var(--text);
      border: 1px solid var(--border); cursor: pointer; position: relative;
    }
    .cal-day.today { border: 2px solid var(--accent); }
    .cal-day.has-entry { font-weight: 700; }
    .cal-day .dot {
      width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px;
    }
    .diary-editor {
      margin-top: 20px; background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 16px;
    }
    .diary-editor h3 { font-size: 14px; color: var(--text); margin-bottom: 10px; }
    .diary-editor textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; font-size: 13px; outline: none; background: var(--bg);
      color: var(--text); height: 140px; line-height: 1.6;
    }
    .diary-actions { display: flex; gap: 8px; margin-top: 12px; }
    /* 日记：实体书双页 */
    .book-nav { display:flex; align-items:center; justify-content:center; gap:12px; margin:4px 0 10px; }
    .book-nav button { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:7px 16px; color:var(--text); font-size:13px; cursor:pointer; }
    .book-nav button:disabled { opacity:.4; }
    .book-indicator { text-align:center; font-size:11px; color:var(--sub); margin-bottom:10px; }
    .book-wrap { perspective:1600px; touch-action:pan-y; }
    .book-spread { display:flex; position:relative; transform-style:preserve-3d; transition:transform .5s ease, opacity .5s ease; border-radius:10px; overflow:hidden; }
    .book-spread.flip-out { opacity:.55; }
    .book-spread.flip-out.forward { transform:rotateY(50deg) scale(.96); }
    .book-spread.flip-out.back { transform:rotateY(-50deg) scale(.96); }
    .book-page { flex:1 1 0; min-width:0; max-height:52vh; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#f7efdd; color:#4a3b2a; padding:14px 16px 20px; background-image:repeating-linear-gradient(to bottom, transparent 0 25px, rgba(74,59,42,.06) 25px 26px); }
    .book-page.left { border-radius:10px 0 0 10px; }
    .book-page.right { border-radius:0 10px 10px 0; }
    .book-spine { flex:0 0 16px; background:linear-gradient(to bottom,#f0e3c4,#e3d0a8 50%,#f0e3c4); box-shadow:inset -4px 0 6px rgba(0,0,0,.16), inset 3px 0 5px rgba(0,0,0,.08); }
    .book-page-head { font-size:13px; font-weight:700; letter-spacing:.06em; text-align:center; color:#5a472c; }
    .book-page-date { font-size:11px; text-align:center; color:#8a7a5f; margin:2px 0 12px; }
    .book-notes { display:flex; flex-direction:column; gap:14px; }
    .book-note { border-radius:8px; padding:8px 10px; }
    .book-note.user { background:rgba(90,60,20,.06); }
    .book-note.char { background:rgba(120,30,60,.05); }
    .book-note.user .book-note-text { font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif; font-size:16px; line-height:1.7; }
    .book-note.char .book-note-text { font-family:'Zhi Mang Xing','KaiTi','STKaiti',serif; font-size:16px; line-height:1.7; }
    .book-note-meta { display:flex; align-items:center; gap:6px; font-size:10px; color:#8a7a5f; margin-top:6px; }
    .book-note-meta .book-del { background:none; border:none; color:#b08d6a; font-size:12px; cursor:pointer; margin-left:auto; padding:0 2px; }
    .book-empty-notes { font-size:11px; color:#8a7a5f; text-align:center; padding:20px 0; line-height:1.7; cursor:pointer; }
    .book-actions { display:flex; gap:8px; margin-top:14px; }
    .book-actions .btn-accent, .book-actions .btn-accent2 { flex:1; padding:11px 8px; font-size:13px; }
    .book-inp { width:100%; min-height:120px; resize:vertical; background:transparent; border:none; outline:none; font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif; font-size:18px; line-height:1.8; color:#4a3b2a; }
    .book-inp.char-font { font-family:'Zhi Mang Xing','KaiTi','STKaiti',serif; }
    .book-composer textarea { background:#faf3e3; }
    /* 实体书封面（笔记本封面图） */
    .book-cover-view { display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:14px; }
    .book-cover-view img { width:80%; max-width:340px; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.18); }
    .book-cover-view .btn-accent { padding:12px 36px; font-size:15px; border-radius:999px; }
    /* 内联写：编辑器直接长在书页上 */
    .book-inline-edit { margin-top:12px; background:rgba(255,255,255,.55); border:1px solid rgba(74,59,42,.25); border-radius:10px; padding:8px; }
    .book-inline-edit textarea { width:100%; min-height:120px; resize:vertical; background:transparent; border:none; outline:none; font-family:'Ma Shan Zheng','KaiTi','STKaiti',serif; font-size:16px; line-height:1.7; color:#4a3b2a; }
    .book-inline-edit textarea.char-font { font-family:'Zhi Mang Xing','KaiTi','STKaiti',serif; }
    .book-inline-actions { display:flex; gap:6px; margin-top:6px; }
    .book-inline-actions .btn-ghost, .book-inline-actions .btn-accent, .book-inline-actions .btn-accent2 { flex:1; padding:8px; font-size:12px; }

    /* 日记：一屏一面（真实本子，一页一条，翻页即新页） */
    .book-single-wrap { perspective:1600px; touch-action:pan-y; padding: 2px 0 6px; }
    .book-single-page {
      margin: 0 auto;
      width: min(88vw, calc((100vh - 330px) * 0.7302));
      aspect-ratio: 1080 / 1479;
      background-size: cover; background-position: center top; background-repeat: no-repeat;
      border-radius: 8px; box-shadow: 0 12px 28px rgba(0,0,0,.22);
      color:#4a3b2a; position:relative; overflow:hidden;
      display:flex; flex-direction:column;
      transform-style:preserve-3d; transition: transform .5s ease, opacity .5s ease;
    }
    .book-single-page.flip-out { opacity:.55; }
    .book-single-page.flip-out.forward { transform: rotateY(48deg) scale(.96); }
    .book-single-page.flip-out.back { transform: rotateY(-48deg) scale(.96); }

    /* NSFW 叙事模式：对白正常，叙事描写斜体楷体玫瑰粉 */
    .nf-narr { font-style: italic; font-family: "Kaiti SC","STKaiti","KaiTi","Xingkai SC",serif; color: color-mix(in srgb, var(--accent) 40%, #d96a9a); }
    .nf-talk { }
    /* 雾玻璃 / 水玻璃气泡 */
    .bubble.glass-fog {
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border: 1px solid rgba(255,255,255,0.35) !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,0.35);
    }
    .bubble.glass-water {
      backdrop-filter: blur(22px) saturate(1.6) brightness(1.05);
      -webkit-backdrop-filter: blur(22px) saturate(1.6) brightness(1.05);
      border: 1px solid rgba(255,255,255,0.5) !important;
      box-shadow:
        0 6px 20px rgba(0,0,0,0.1),
        inset 0 1px 0 rgba(255,255,255,0.55),
        inset 0 -8px 16px rgba(255,255,255,0.12);
    }
    .bubble.me.glass-fog, .bubble.me.glass-water {
      background: var(--bubble-me-glass) !important;
      color: var(--bubble-me-fg, #fff);
    }
    .bubble.them.glass-fog, .bubble.them.glass-water {
      background: var(--bubble-them-glass) !important;
      color: var(--bubble-them-fg, var(--text));
    }
    /* ── 全局雾/水玻璃材质 ────────────────────────────────────────────────
       2026-09-04 重写。原来这里是一串手打的类名白名单（cal-day / feat-card /
       mem-card … 一共 21 个）。而全 App 有 117 个类以 var(--card) 为底 ——
       剩下 96 个在玻璃态下就是一块死白，`.section-body`（几乎每个功能页的外壳）
       也在里面。「有的功能没美化」就是这么来的：白名单是手打的，后来加的功能
       没人回去登记，和「六轴表项缺失导致某情绪永不出现」是同一类毛病。

       改成直接把 --card / --border 本身换成半透明：所有卡片自动跟着透，
       以后新加功能不用再来登记一次，白名单这个维护陷阱直接没了。
       （--card-opaque / --border-opaque 由 applyThemeVars 另存一份 ——
       在同一个元素上写 --card: color-mix(…var(--card)…) 是自引用循环，会静默失效。）

       真模糊只留顶栏/子页顶栏/输入条/底栏那几层，见下面 shell-classic 那段。
       这里一律不加 backdrop-filter：一屏几十个模糊层手机 GPU 扛不住，
       上一轮撤蓝晒气泡的模糊就是这个原因。半透明 + 壁纸透过来已经够出材质了。 */
    #app.ui-glass-fog {
      --card: color-mix(in srgb, var(--card-opaque) 70%, transparent);
      --border: color-mix(in srgb, #fff 38%, var(--border-opaque));
    }
    #app.ui-glass-water {
      --card: color-mix(in srgb, var(--card-opaque) 56%, transparent);
      --border: color-mix(in srgb, #fff 52%, var(--border-opaque));
    }
    #app.ui-glass-fog .duty-day.done,
    #app.ui-glass-water .duty-day.done {
      background: color-mix(in srgb, var(--accent) 55%, rgba(255,255,255,0.35)) !important;
    }

    /* ── 玻璃的例外：思考链 / 收藏记录 ────────────────────────────────────
       上面那条「直接换掉 --card」是按卡片设计的：卡片底下是壁纸，透一点出材质。
       但这两处底下压着聊天正文，半透明又没有 backdrop-filter（有意不加，见上），
       于是下层的字直接透上来和上层的字叠在一起 —— 不是材质，是没法读。
       浮层和长文区一律要实底。改法是在容器自己身上把变量改回不透明：
       内部所有 var(--card) / var(--border) 一起跟着回来，不用逐条属性去改，
       以后这两块加新元素也不会再漏。（--card: var(--card-opaque) 是两个不同的
       变量名，不构成上面注释里说的那种自引用循环。） */
    #app.ui-glass-fog .think-modal,
    #app.ui-glass-water .think-modal,
    #app.ui-glass-fog .saved-modal,
    #app.ui-glass-water .saved-modal,
    #app.ui-glass-fog .saved-item,
    #app.ui-glass-water .saved-item,
    #app.ui-glass-fog .saved-search-box,
    #app.ui-glass-water .saved-search-box,
    #app.ui-glass-fog .msg-bar button,
    #app.ui-glass-water .msg-bar button {
      --card: var(--card-opaque);
      --border: var(--border-opaque);
    }

    /* ── 玻璃气泡时，顶栏 / 底栏 / 输入条跟着变玻璃 ──────────────────────────
       以前这三条一律 background: var(--card) 实色（.bottom-nav 还写了句
       backdrop-filter，但底色不透明，那句等于白写）。选了水玻璃之后气泡是透的、
       壁纸透得过来，只剩这几条 chrome 还是死实色，接缝就特别扎眼。
       只挂 shell-classic：像素/深渊/韩系/蓝晒各有自己的边框语言，别误伤。
       模糊层仍然只有这三四条 chrome —— 不是给几十个卡片加的（手机 GPU 很贵）。 */
    /* 注意底色取的是 --card-opaque 不是 --card：玻璃态下 --card 本身已经是半透明的，
       再 mix 一次就透过头了。 */
    body.shell-classic #app.ui-glass-fog .chat-header,
    body.shell-classic #app.ui-glass-fog .bottom-nav,
    body.shell-classic #app.ui-glass-fog .chat-input-bar {
      background: color-mix(in srgb, var(--card-opaque) 62%, transparent);
      backdrop-filter: blur(14px) saturate(1.2);
      -webkit-backdrop-filter: blur(14px) saturate(1.2);
      border-color: color-mix(in srgb, #fff 30%, var(--border-opaque));
    }
    body.shell-classic #app.ui-glass-water .chat-header,
    body.shell-classic #app.ui-glass-water .bottom-nav,
    body.shell-classic #app.ui-glass-water .chat-input-bar {
      background: color-mix(in srgb, var(--card-opaque) 45%, transparent);
      backdrop-filter: blur(22px) saturate(1.6) brightness(1.05);
      -webkit-backdrop-filter: blur(22px) saturate(1.6) brightness(1.05);
      border-color: color-mix(in srgb, #fff 45%, var(--border-opaque));
    }
    /* 边缘高光：和气泡的 inset 高光同一套语言，让接缝是"一层玻璃"而不是"一条线" */
    body.shell-classic #app.ui-glass-water .chat-header {
      box-shadow: 0 1px 12px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.45);
    }
    body.shell-classic #app.ui-glass-water .bottom-nav,
    body.shell-classic #app.ui-glass-water .chat-input-bar {
      box-shadow: 0 -1px 12px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.45);
    }
    /* 输入框自己是实色 --bg，玻璃条上一块实心方块又会把接缝拉回来 */
    body.shell-classic #app.ui-glass-fog .chat-input-bar textarea,
    body.shell-classic #app.ui-glass-water .chat-input-bar textarea {
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      border-color: color-mix(in srgb, #fff 40%, var(--border));
    }
    /* 子页顶栏本来就是玻璃，只是 92% 几乎不透明；玻璃态下跟着透一点 */
    body.shell-classic #app.ui-glass-fog .sub-header {
      background: color-mix(in srgb, var(--bg) 62%, transparent);
    }
    body.shell-classic #app.ui-glass-water .sub-header {
      background: color-mix(in srgb, var(--bg) 45%, transparent);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
    }

    .bubble-time {
      font-size: 9px; color: var(--sub); opacity: 0.6; margin: 0 4px 8px;
      text-align: right;
    }
    .bubble-row.them + .bubble-time, .bubble-time.them { text-align: left; margin-left: 36px; }

    /* 思考链可折叠 */
    .thinking-block {

      padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);

    .form-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
    .form-row label { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
    .form-row input[type=range] { width: 80px; accent-color: var(--accent); }
    .mem-list { display: flex; flex-direction: column; gap: 10px; }
    .mem-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 13px 15px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); transition: all 0.2s;

    .mem-card.selected {

    }
    .mem-card-inner { display: flex; align-items: flex-start; gap: 10px; }
    .mem-check {

    .mem-check.on { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 10px; }
    .mem-meta { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
    .layer-tag { border-radius: 999px; padding: 2px 9px; font-size: 10px; font-weight: 600; }

    .mem-content {

      word-break: break-word;

    .mem-content.expanded { display: block; -webkit-line-clamp: unset; overflow: visible; }
    .mem-expand { background: none; border: none; color: var(--accent); font-size: 11px; cursor: pointer; padding: 0; margin-top: 4px; }
    .mem-footer { display: flex; gap: 12px; margin-top: 8px; font-size: 10px; color: var(--sub); opacity: 0.85; }
    .mem-del { background: none; border: none; color: var(--sub); font-size: 14px; cursor: pointer; flex-shrink: 0; padding: 4px; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--sub); font-size: 13px; line-height: 1.8; }
    .empty-emoji { font-size: 40px; margin-bottom: 8px; opacity: 0.6; }
    .album-count { text-align:center; font-size:11px; color:var(--sub); margin:10px 0 0; }
    .album-viewport { position:relative; margin:8px auto 0; width:100%; aspect-ratio:1/1.05; border-radius:18px; overflow:hidden; background:#000; touch-action:pan-y; }
    .album-card { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0; transform:translateX(24px); transition:all .3s; }
    .album-card.on { opacity:1; transform:none; }
    .album-card img { width:100%; height:100%; object-fit:contain; }
    .album-info { padding:12px 4px 4px; }
    .album-date { font-size:11px; color:var(--sub); margin-bottom:6px; }
    .album-caption { font-size:14px; color:var(--text); line-height:1.7; min-height:42px; }
    .album-actions { display:flex; gap:8px; margin-top:12px; }
    .album-actions .btn-ghost, .album-actions .btn-accent { flex:1; padding:10px 8px; font-size:12px; }



    /* 音乐 / 一起听 */
    .music-topbar {
      position: sticky; top: 0; z-index: 40; /* 低于 .chat-header(50)，勿挡顶栏按钮 */
      background: color-mix(in srgb, var(--card) 92%, transparent);

      backdrop-filter: blur(12px);
