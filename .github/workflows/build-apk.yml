name: Build Memory Palace APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'dist/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

# Release 资产不占 Actions 产物存储配额（免费账号 500MB 已满时仍可发）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装 npm 依赖
        run: |
          npm config set registry https://registry.npmjs.org/
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $i failed, retry in 15s..."
            sleep 15
          done
          echo "npm ci failed 3x, trying npm install..."
          npm install --no-audit --no-fund

      - name: 从 frontend 源文件重新生成 dist
        run: python3 frontend/build.py

      - name: 同步 Capacitor 原生工程
        run: npx cap sync android

      - name: 构建 APK
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/release/ || true

      - name: 发布 APK 到 Release（不走 Actions 产物配额）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MemoryPalace APK (latest)
          body: |
            自动构建的最新 APK。
            - 来源分支：`${{ github.ref_name }}`
            - 提交：`${{ github.sha }}`
            - 下载下方 `app-release.apk` 安装即可。
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
