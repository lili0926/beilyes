name: Build Memory Palace APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'dist/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: 安装 npm 依赖
        run: |
          npm config set registry https://registry.npmjs.org/
          # 网络抖动时重试；ci 失败再 fallback install
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $i failed, retry in 15s..."
            sleep 15
          done
          echo "npm ci failed 3x, trying npm install..."
          npm install --no-audit --no-fund

      - name: 从 frontend 源文件重新生成 dist
        run: python3 frontend/build.py

      - name: 同步 Capacitor 原生工程
        run: npx cap sync android

      - name: 构建 APK
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: MemoryPalace-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2
          compression-level: 6

      - name: 创建 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
