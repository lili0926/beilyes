name: Build Memory Palace APK

on:
  # 手动触发：仓库页面 → Actions → Build Memory Palace APK → Run workflow
  workflow_dispatch:
  # 改动到前端/Android 工程时自动触发
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 装回 capacitor 原生模块（android/capacitor.settings.gradle 引用 node_modules）
      - name: 安装 npm 依赖
        run: npm ci

      # 把最新前端资源塞进 APK 的 assets/public（和 VPS 上 build_apk.sh 一样的做法）
      - name: 同步前端资源
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      # 关键：build.gradle 里 debug 和 release 都指向 keystore/memory-palace.keystore，
      # 签名固定（CN=Memory Palace / e24ec557），可直接覆盖安装旧版
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew   # Windows 提交可能丢了执行位，这里补上
          ./gradlew assembleRelease --no-daemon

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: MemoryPalace-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 打 tag（如 v1.0.1）时额外生成一个 Release，给手机直接下载的链接
      - name: 创建 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
