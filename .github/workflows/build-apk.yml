name: Build Memory Palace APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'dist/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 安装 npm 依赖
        run: npm ci

      - name: 从 frontend 源文件重新生成 dist
        run: python3 frontend/build.py

      - name: 同步 Capacitor 原生工程
        run: npx cap sync android

      - name: 构建 APK
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=768m -Dorg.gradle.daemon=false
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 到 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: MemoryPalace-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 创建 GitHub Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
