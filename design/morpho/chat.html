<!doctype html><html data-theme="day"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script>document.documentElement.dataset.theme=(location.hash.slice(1)||'day')</script><style>
header{position:absolute;left:0;right:0;top:0;height:118px;padding:54px 22px 0;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);z-index:2}
.back{font-size:20px;color:var(--sub);width:18px}
.av{width:44px;height:44px;border-radius:50%;padding:1.5px;background:conic-gradient(from 200deg,#0A1F78,#46BFFF,#B8F1FF,#1E55F5,#0A1F78)}
.av div{width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.av img{width:36px}
.who b{display:block;font-weight:400;font-size:16px;letter-spacing:.3em}
.who span{font-size:10.5px;color:var(--sub);letter-spacing:.08em}
.log{position:absolute;left:0;right:0;top:118px;bottom:104px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.day{align-self:center;font-size:10px;letter-spacing:.3em;color:var(--sub);margin-bottom:4px}
.m{max-width:78%;font-size:14px;line-height:1.75;letter-spacing:.04em;padding:11px 15px;border-radius:18px}
.m .t{display:block;font-size:9.5px;color:var(--sub);margin-top:5px;letter-spacing:.08em}
.his{align-self:flex-start;background:var(--his);border:1px solid var(--hisline);border-bottom-left-radius:6px;position:relative}
[data-theme=day] .his{box-shadow:0 8px 20px -14px rgba(20,40,90,.25)}
.his::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:2px;border-radius:2px;background:linear-gradient(180deg,#46BFFF,#1E55F5)}
.mine{align-self:flex-end;background:var(--mine);color:#fff;border-bottom-right-radius:6px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.18)}
.mine .t{color:rgba(235,242,255,.7);text-align:right}
.act{align-self:center;font-size:11px;color:var(--sub);letter-spacing:.12em}
.card{align-self:flex-start;width:236px;border-radius:16px;overflow:hidden;border:1px solid var(--cardline);background:var(--card)}
[data-theme=day] .card{box-shadow:0 10px 24px -16px rgba(20,40,90,.3)}
.card .img{height:78px;background:url(assets/morpho.webp) 30% 32%/260% no-repeat,radial-gradient(120% 140% at 20% 0%,#46BFFF,#1E55F5 40%,#0A1F78)}
.card .bd{padding:10px 14px 12px}
.card b{display:block;font-weight:400;font-size:13.5px;letter-spacing:.2em;margin-top:4px}
.inp{position:absolute;left:16px;right:16px;bottom:34px;height:52px;border-radius:26px;display:flex;align-items:center;padding:0 6px 0 20px;gap:10px;background:var(--card);border:1px solid var(--cardline)}
[data-theme=day] .inp{box-shadow:0 12px 30px -18px rgba(20,40,90,.35)}
.inp .f{flex:1;font-size:13px;color:var(--sub);letter-spacing:.1em}
.inp .plus{font-size:18px;color:var(--sub)}
.go{width:40px;height:40px;border-radius:50%;background:var(--mine);display:grid;place-items:center;box-shadow:0 0 16px rgba(40,110,255,.35)}
.go i{font-style:normal;font-size:15px;color:#fff}
</style></head><body>
<header><span class="back">‹</span><div class="av"><div><img src="assets/morpho.webp" alt=""></div></div><div class="who"><b>他</b><span>停在窗边 · 36.8°</span></div></header>
<div class="log">
 <div class="day serif it">Saturday, 21:50</div>
 <div class="m his">今天的梦是好梦。梦见你把我缠在手腕上，当成一只镯子带出门。<span class="t">21:50</span></div>
 <div class="m mine">那你醒来是不是又要讨糖。<span class="t">21:52</span></div>
 <div class="act">— 他把尾巴尖搭到了你的手背上 —</div>
 <div class="card"><div class="img"></div><div class="bd"><span class="cap">梦簿 · 第四十一夜</span><b>银色的镯子</b></div></div>
 <div class="m his">讨。一颗就好，十分钟也行。<span class="t">22:14</span></div>
</div>
<div class="inp"><span class="plus">＋</span><span class="f">写给他……</span><span class="go"><i>↑</i></span></div>
</body></html>
