<!doctype html><html data-theme="day"><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<script>document.documentElement.dataset.theme=(location.hash.slice(1)||'day')</script><style>

.no{position:absolute;left:0;right:0;top:372px;text-align:center}

.menu a.on .t,.menu a.on .ar{color:var(--blue)}
.menu a.on{border-bottom:1px solid var(--blue)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px var(--blue);margin-left:8px;vertical-align:middle}
.last{position:absolute;left:26px;right:26px;bottom:34px;padding:13px 16px;border-radius:14px;background:var(--card);border:1px solid var(--cardline);box-shadow:0 10px 30px -20px rgba(20,40,90,.3)}

.last p{font-size:13.5px;line-height:1.75;letter-spacing:.06em}
.sw{position:absolute;right:26px;top:80px;display:flex;gap:6px;font-size:9px;letter-spacing:.2em;color:var(--sub)}
.sw i{font-style:normal;padding:3px 7px;border:1px solid var(--line);border-radius:999px}
.sw i.on{color:var(--ink);border-color:var(--ink)}
