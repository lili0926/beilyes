<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
header{position:absolute;left:0;right:0;top:0;height:112px;padding:52px 26px 0;display:flex;align-items:flex-start;justify-content:space-between}
header .back{font-size:11px;letter-spacing:.4em;color:var(--sub)}
header .who{text-align:center}
header .who b{font-weight:400;font-size:17px;letter-spacing:.6em}
header .who small{display:block;font-size:9px;letter-spacing:.4em;color:var(--sub);margin-top:6px}
header .st{font-size:9.5px;letter-spacing:.3em;color:var(--moss)}
.rule{position:absolute;left:26px;right:26px;top:118px}
.log{position:absolute;left:0;right:0;top:132px;bottom:118px;padding:18px 26px;display:flex;flex-direction:column;gap:22px}
.day{text-align:center;font-size:9px;letter-spacing:.7em;color:var(--sub)}
.m{max-width:82%;font-size:14px;line-height:1.95;letter-spacing:.08em}
.m .t{display:block;font-size:9px;letter-spacing:.3em;color:var(--sub);margin-top:6px}
.his{align-self:flex-start;padding-left:14px;border-left:1px solid var(--ink)}
.mine{align-self:flex-end;text-align:right;padding-right:14px;border-right:1px solid var(--shu);color:#3A3631}
.act{align-self:flex-start;font-size:11px;color:var(--sub);letter-spacing:.2em;padding-left:14px}
.act::before{content:"—  "}
.card{align-self:flex-start;display:flex;gap:14px;align-items:center;padding:12px 16px 12px 14px;border:1px solid var(--line);background:rgba(255,255,255,.28)}
.card .k{font-size:9px;letter-spacing:.4em;color:var(--sub)}
.card b{font-weight:400;font-size:13px;letter-spacing:.3em;display:block;margin-top:4px}
.card .han{width:26px;height:26px;font-size:9px}
.inp{position:absolute;left:26px;right:26px;bottom:44px;display:flex;align-items:flex-end;gap:16px}
.inp .f{flex:1;border-bottom:1px solid var(--ink);padding:0 0 8px;font-size:13px;color:var(--sub);letter-spacing:.2em}
.inp .go{width:42px;height:42px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-size:13px}
.inp .side{position:absolute;left:0;bottom:-24px;font-size:9px;letter-spacing:.5em;color:var(--sub)}

 <div class="day">十 月 三 日 · 夜</div>
